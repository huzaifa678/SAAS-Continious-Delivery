---
replicas: 2
port: 8081

image:
  repository: "533267178572.dkr.ecr.us-east-1.amazonaws.com/subscription-service"
  tag: "latest"

externalSecret:
  enabled: true

  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  remoteRef:
    key: saas/subscription-service

  target:
    name: subscription-service

istio:
  enabled: false
  revision: ""

serviceAccount:
  create: true
  name: ""   # defaults to the service name; must match infra kafka_clients SA

security:
  peerAuthentication:
    enabled: true
    mode: STRICT
  authorizationPolicy:
    enabled: true
    allowedNamespaces:
      - saas-apps
      - istio-system
      - monitoring
  networkPolicy:
    enabled: true
    ingressNamespaces:
      - saas-apps
      - istio-system
      - monitoring
    allowAllEgress: false
  ciliumEgress:
    enabled: true
    rds: true
    kafka: true

rollout:
  revisionHistoryLimit: 5
  maxSurge: "25%"
  maxUnavailable: 0
  analysis:
    enabled: false
    provider: prometheus
    startingStep: 1
    interval: "1m"
    count: 5
    failureLimit: 2
    successRateThreshold: 0.99
    p95LatencyThresholdMs: 500
    prometheusAddress: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090"
    templates:
      - templateName: subscription-service-success-rate
      - templateName: subscription-service-latency-p95
  steps:
    - setWeight: 25
    - pause:
        duration: "30s"
    - setWeight: 50
    - pause:
        duration: "30s"
    - setWeight: 100

livenessProbe:
  path: /healthz/live
  initialDelaySeconds: 20
  periodSeconds: 10

readinessProbe:
  path: /healthz/ready
  initialDelaySeconds: 15
  periodSeconds: 5

keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  fallback: {}
  advanced: {}
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"

# TypeORM migrations, run as an Argo CD Sync hook (templates/db-migration.yaml) before
# the Rollout. The Job reuses the service image (compiled migrations baked in under
# dist/migrations) and connects with the SAME POSTGRES_* creds the app uses, from the
# ExternalSecret-synced Secret (externalSecret.target.name). No Crossplane AppDatabase:
# the DB/role already exist in RDS and the app owns its tables via this role.
database:
  # subscription-service does NOT use a Crossplane AppDatabase (no appdatabase.yaml
  # template, and it connects with the SM-synced app secret, not an AppDatabase owner
  # role). enabled is therefore inert here, but the repo-wide CUE #Database contract
  # (schemas/service) still requires enabled/instance/databaseName/owner — so they record
  # which RDS DB/role the service maps to. Keep in sync with
  # saas-services-infra/layers/20-data.
  enabled: false
  instance: subscription
  databaseName: subscription_db
  owner: subscription_user
  migrations:
    enabled: true
    # image "" → the db-migration Job defaults to image.repository:image.tag (the service
    # image, which bundles the TypeORM migrations); kept empty to avoid tag drift.
    image: ""
    # sslmode is inert for this service (TypeORM reads conn params from POSTGRES_*); set to
    # a valid value only to satisfy the shared contract.
    sslmode: require
    backoffLimit: 3
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 1800
