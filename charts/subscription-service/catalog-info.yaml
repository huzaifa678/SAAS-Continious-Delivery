apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: subscription-service
  description: subscription microservice.
  annotations:
    github.com/project-slug: huzaifa678/subscription-service
    # Argo CD app names are <service>-<env>; dev shown by default.
    argocd/app-name: subscription-service-dev
    # Pods carry label app=<service>, in namespace saas-apps (Argo Rollouts).
    backstage.io/kubernetes-label-selector: app=subscription-service
    backstage.io/kubernetes-namespace: saas-apps
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: saas-services
