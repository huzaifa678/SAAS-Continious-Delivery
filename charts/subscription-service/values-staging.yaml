---
replicas: 2
image:
  repository: "533267178572.dkr.ecr.us-east-1.amazonaws.com/subscription-service"
  tag: "sha-e11af08f8949d26a067b3248b30d384753449beb"
istio:
  enabled: true
  revision: ""
circuitBreaking:
  maxConnections: 100
  http1MaxPendingRequests: 1000
  http2MaxRequests: 1000
  maxRequestsPerConnection: 100
  outlierDetection:
    consecutive5xxErrors: 5
    interval: "30s"
    baseEjectionTime: "30s"
    maxEjectionPercent: 10
# Staging: full canary progression with Prometheus analysis between steps
rollout:
  analysis:
    enabled: true
    interval: "1m"
    count: 3
    failureLimit: 1
    successRateThreshold: 0.98
    p95LatencyThresholdMs: 750
  steps:
    - setWeight: 20
    - pause:
        duration: "1m"
    - analysis:
        templates:
          - templateName: subscription-service-success-rate
          - templateName: subscription-service-latency-p95
    - setWeight: 50
    - pause:
        duration: "1m"
    - analysis:
        templates:
          - templateName: subscription-service-success-rate
          - templateName: subscription-service-latency-p95
    - setWeight: 100
keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 8
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

security:
  ciliumEgress:
    # Cilium toFQDNs needs the DNS-visibility rule to ALLOW resolving the endpoint
    # name so it can learn the IP; the previous "*.amazonaws.com" pattern was REFUSED
    # for the multi-label RDS host, breaking resolution. "*" permits resolution only —
    # actual egress stays restricted to the rds/kafka/redis toFQDNs below.
    dnsMatchPatterns:
      - "*"
    rds: true
    kafka: true
    redis: true
