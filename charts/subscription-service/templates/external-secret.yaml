{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name | default "subscription-service" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: subscription-service
  annotations:
    # Sync before the db-migrate hook (wave -2) and the Rollout (wave 0) so ESO has
    # written the target Secret first. The ExternalSecret health check in argocd-cm
    # makes Argo CD wait for status Ready before advancing the wave.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}

  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}

  target:
    name: {{ .Values.externalSecret.target.name | default "subscription-service" }}
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteRef.key }}
{{- end }}