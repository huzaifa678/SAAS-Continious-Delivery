{{- if and .Values.rollout.analysis.enabled (eq (.Values.rollout.analysis.provider | default "prometheus") "prometheus") }}
{{- $svc := "auth-service" }}
{{- $a := .Values.rollout.analysis }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ $svc }}-success-rate
spec:
  args:
  - name: service-name
  - name: namespace
  metrics:
  - name: success-rate
    interval: {{ $a.interval | default "1m" }}
    count: {{ $a.count | default 5 }}
    successCondition: result[0] >= {{ $a.successRateThreshold | default 0.99 }}
    failureLimit: {{ $a.failureLimit | default 2 }}
    provider:
      prometheus:
        address: {{ $a.prometheusAddress | default "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090" | quote }}
        query: |
          sum(irate(istio_requests_total{
              reporter="destination",
              destination_workload=~"{{`{{args.service-name}}`}}.*",
              destination_workload_namespace="{{`{{args.namespace}}`}}",
              response_code!~"5.*"
          }[2m]))
          /
          sum(irate(istio_requests_total{
              reporter="destination",
              destination_workload=~"{{`{{args.service-name}}`}}.*",
              destination_workload_namespace="{{`{{args.namespace}}`}}"
          }[2m]))
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ $svc }}-latency-p95
spec:
  args:
  - name: service-name
  - name: namespace
  metrics:
  - name: latency-p95-ms
    interval: {{ $a.interval | default "1m" }}
    count: {{ $a.count | default 5 }}
    successCondition: result[0] <= {{ $a.p95LatencyThresholdMs | default 500 }}
    failureLimit: {{ $a.failureLimit | default 2 }}
    provider:
      prometheus:
        address: {{ $a.prometheusAddress | default "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090" | quote }}
        query: |
          histogram_quantile(0.95,
            sum(irate(istio_request_duration_milliseconds_bucket{
              reporter="destination",
              destination_workload=~"{{`{{args.service-name}}`}}.*",
              destination_workload_namespace="{{`{{args.namespace}}`}}"
            }[2m])) by (le)
          )
{{- end }}
