{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name | default "auth-service" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: auth-service
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}

  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}

  target:
    name: {{ .Values.externalSecret.target.name | default "auth-service" }}
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteRef.key }}
{{- end }}