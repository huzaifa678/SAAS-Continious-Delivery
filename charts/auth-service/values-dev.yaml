replicas: 1

image:
  repository: ""  # e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/auth-service
  tag: "dev"

istio:
  enabled: false

# Dev: fast canary, no analysis (no Prometheus dependency in dev path)
rollout:
  analysis:
    enabled: false
  steps:
    - setWeight: 50
    - pause:
        duration: "10s"
    - setWeight: 100

keda:
  enabled: false
