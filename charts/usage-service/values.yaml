replicas: 2
port: 8083

image:
  repository: ""
  tag: "latest"

istio:
  enabled: false
  revision: ""

blueGreen:
  activeSlot: blue
  previewSlot: green
  previewTag: "latest"
  activeWeight: 100
  previewWeight: 0

livenessProbe:
  path: /healthz/live
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  path: /healthz/ready
  initialDelaySeconds: 30
  periodSeconds: 5

keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  fallback: {}
  advanced: {}
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
