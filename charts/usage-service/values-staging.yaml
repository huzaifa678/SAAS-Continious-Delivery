replicas: 2

image:
  repository: "" 
  tag: "staging"

istio:
  enabled: true
  revision: ""

circuitBreaking:
  maxConnections: 100
  http1MaxPendingRequests: 1000
  http2MaxRequests: 1000
  maxRequestsPerConnection: 100
  outlierDetection:
    consecutive5xxErrors: 5
    interval: "30s"
    baseEjectionTime: "30s"
    maxEjectionPercent: 10

keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 8
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"
