---
{{- if .Values.database.enabled }}
{{- $svc := "usage-service" }}
apiVersion: platform.saas.example/v1alpha1
kind: AppDatabase
metadata:
  name: {{ $svc }}
  labels:
    app: {{ $svc }}
  annotations:
    # Provision the DB (and write the connection Secret) BEFORE the Liquibase migrate
    # hook (Sync wave -5) and the Rollout (wave 0). Previously the migrate PreSync hook
    # ran before this sync-phase claim, so the Secret never existed and sync deadlocked.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  parameters:
    databaseName: {{ .Values.database.databaseName | quote }}
    owner:        {{ .Values.database.owner | quote }}
    instance:     {{ .Values.database.instance | quote }}
    {{- with .Values.database.extensions }}
    extensions:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  # Crossplane writes the connection details (host, port, db, user, password, dsn)
  # to this Secret in the same namespace. Mount it into the service Pod.
  writeConnectionSecretToRef:
    name: {{ $svc }}-db
{{- end }}
