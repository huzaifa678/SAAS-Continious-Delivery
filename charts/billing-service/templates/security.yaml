---
{{- $svc := "billing-service" }}
{{- $sec := .Values.security | default dict }}
{{- $pa := $sec.peerAuthentication | default dict }}
{{- $ap := $sec.authorizationPolicy | default dict }}
{{- $np := $sec.networkPolicy | default dict }}
{{- $allowedNs := $ap.allowedNamespaces | default (list "saas-apps" "istio-system" "monitoring") }}
{{- $ingressNs := $np.ingressNamespaces | default (list "saas-apps" "istio-system" "monitoring") }}
{{- if and .Values.istio.enabled ($pa.enabled | default true) }}
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ $svc }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $svc }}
spec:
  selector:
    matchLabels:
      app: {{ $svc }}
  mtls:
    mode: {{ $pa.mode | default "STRICT" }}
{{- end }}
{{- if and .Values.istio.enabled ($ap.enabled | default true) }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $svc }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $svc }}
spec:
  selector:
    matchLabels:
      app: {{ $svc }}
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
            {{- range $allowedNs }}
              - {{ . | quote }}
            {{- end }}
{{- end }}
{{- if $np.enabled | default true }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $svc }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $svc }}
spec:
  podSelector:
    matchLabels:
      app: {{ $svc }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                {{- range $ingressNs }}
                  - {{ . | quote }}
                {{- end }}
  egress:
    {{- if $np.allowAllEgress | default true }}
    - {}
    {{- else }}
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - "saas-apps"
                  - "istio-system"
                  - "kube-system"
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
{{- end }}
{{- $ce := $sec.ciliumEgress | default dict }}
{{- if $ce.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $svc }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $svc }}
spec:
  endpointSelector:
    matchLabels:
      app: {{ $svc }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              {{- range ($ce.dnsMatchPatterns | default (list "*.amazonaws.com")) }}
              - matchPattern: {{ . | quote }}
              {{- end }}
    {{- if $ce.rds }}
    - toFQDNs:
        - matchPattern: "*.rds.amazonaws.com"
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    {{- end }}
    {{- if $ce.kafka }}
    - toFQDNs:
        - matchPattern: "*.kafka.*.amazonaws.com"
      toPorts:
        - ports:
            - port: "9098"
              protocol: TCP
    {{- end }}
    {{- if $ce.redis }}
    - toFQDNs:
        - matchPattern: "*.cache.amazonaws.com"
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    {{- end }}
{{- end }}
