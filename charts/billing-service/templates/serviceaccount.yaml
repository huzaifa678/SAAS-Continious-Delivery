---
{{- $svc := "billing-service" }}
{{- $sa := .Values.serviceAccount | default dict }}
{{- if $sa.create | default true }}
# Dedicated ServiceAccount so the pod carries a stable identity for EKS Pod
# Identity (e.g. the MSK SASL/IAM role bound to this SA in the infra 20-data
# layer) instead of running as the namespace `default` SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name | default $svc }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Must exist before the migrate Job (Sync hook, wave -5), which runs as this
    # ServiceAccount, and before the Rollout. A Job fails hard ("serviceaccount not
    # found") if its SA is missing at creation, so order the SA ahead of the hook.
    argocd.argoproj.io/sync-wave: "-6"
  labels:
    app: {{ $svc }}
{{- end }}
