{{- if and .Values.database.enabled .Values.database.migrations.enabled }}
{{- $svc := "billing-service" }}
{{- $m := .Values.database.migrations }}
{{- $secret := $m.secretName | default (printf "%s-db" $svc) }}
---
# Liquibase changelog delivered as a ConfigMap. Rendered from charts/<svc>/migrations so
# migrations are versioned in git alongside the chart. PreSync hook, applied before the Job.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $svc }}-db-migrations
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $svc }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
data:
  changelog.sql: |
{{ .Files.Get "migrations/changelog.sql" | indent 4 }}
---
# Argo CD PreSync hook: runs Liquibase to migrate the database BEFORE the new Rollout is
# applied, so the app never starts against an un-migrated schema. Liquibase is idempotent
# (tracks applied changeSets in DATABASECHANGELOG), so re-running each sync is a no-op.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $svc }}-db-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $svc }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    # Replace the previous Job each sync so it re-runs; keep it after success for logs.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: {{ $m.backoffLimit | default 3 }}
  activeDeadlineSeconds: {{ $m.activeDeadlineSeconds | default 600 }}
  ttlSecondsAfterFinished: {{ $m.ttlSecondsAfterFinished | default 1800 }}
  template:
    metadata:
      labels:
        app: {{ $svc }}
        job: db-migrate
      annotations:
        # A mesh sidecar would never exit and the Job would hang; keep this Pod out of it.
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      # The migration Job does not call the Kubernetes API, so it does not need
      # the automatically mounted ServiceAccount token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ (.Values.serviceAccount | default dict).name | default $svc }}
      containers:
        - name: liquibase
          image: {{ $m.image }}
          imagePullPolicy: Always
          command: 
          - /bin/sh
          - -ec
          - | 
            DB_HOST="$(cat /etc/database/host)" 
            DB_PORT="$(cat /etc/database/port)" 
            DB_NAME="$(cat /etc/database/db)" 
            DB_USER="$(cat /etc/database/user)" 
            DB_PASSWORD="$(cat /etc/database/password)" 
            export LIQUIBASE_COMMAND_USERNAME="$DB_USER" 
            export LIQUIBASE_COMMAND_PASSWORD="$DB_PASSWORD" 
            export LIQUIBASE_COMMAND_URL="jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode={{ $m.sslmode | default "require" }}" 
            exec liquibase update
          env:
            - name: LIQUIBASE_COMMAND_CHANGELOG_FILE
              value: changelog.sql
            - name: LIQUIBASE_SEARCH_PATH
              value: /liquibase/changelog
            - name: LIQUIBASE_HEADLESS
              value: "true"
          volumeMounts:
            - name: changelog
              mountPath: /liquibase/changelog
              readOnly: true
            # readOnlyRootFilesystem requires an explicitly writable
            # temporary filesystem for applications that use /tmp.
            - name: db-secret 
              mountPath: /etc/database 
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: changelog
          configMap:
            name: {{ $svc }}-db-migrations
        - name: db-secret 
          secret:
            secretName: {{ $secret }}
        - name: tmp
          emptyDir: {}
{{- end }}
