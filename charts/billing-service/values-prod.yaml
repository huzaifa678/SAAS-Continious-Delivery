replicas: 3

image:
  repository: ""  
  tag: "prod"

istio:
  enabled: true
  revision: ""

blueGreen:
  activeSlot: blue
  previewSlot: green
  previewTag: "prod"
  activeWeight: 100
  previewWeight: 0

circuitBreaking:
  maxConnections: 100
  http1MaxPendingRequests: 1000
  http2MaxRequests: 1000
  maxRequestsPerConnection: 100
  outlierDetection:
    consecutive5xxErrors: 5
    interval: "30s"
    baseEjectionTime: "30s"
    maxEjectionPercent: 10

livenessProbe:
  path: /healthz/live
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  path: /healthz/ready
  initialDelaySeconds: 30
  periodSeconds: 5

keda:
  enabled: true
  minReplicaCount: 3
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
            - type: Pods
              value: 4
              periodSeconds: 30
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "65"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"
