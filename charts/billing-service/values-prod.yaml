replicas: 3

image:
  repository: ""  
  tag: "prod"

istio:
  enabled: true
  revision: ""

blueGreen:
  activeSlot: blue
  previewSlot: green
  previewTag: "prod"
  activeWeight: 100
  previewWeight: 0

circuitBreaking:
  maxConnections: 100
  http1MaxPendingRequests: 1000
  http2MaxRequests: 1000
  maxRequestsPerConnection: 100
  outlierDetection:
    consecutive5xxErrors: 5
    interval: "30s"
    baseEjectionTime: "30s"
    maxEjectionPercent: 10

livenessProbe:
  path: /healthz/live
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  path: /healthz/ready
  initialDelaySeconds: 30
  periodSeconds: 5
