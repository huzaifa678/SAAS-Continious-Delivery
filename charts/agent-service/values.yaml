---
replicas: 2
port: 8083

externalSecret:
  enabled: true

  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  remoteRef:
    key: saas/agent-service

  target:
    name: agent-service

image:
  repository: "533267178572.dkr.ecr.us-east-1.amazonaws.com/agent-service"
  tag: "latest"

istio:
  enabled: false
  revision: ""

serviceAccount:
  create: true
  name: ""   # defaults to the service name; must match infra kafka_clients SA

security:
  peerAuthentication:
    enabled: true
    mode: STRICT
  authorizationPolicy:
    enabled: true
    allowedNamespaces:
      - saas-apps
      - istio-system
      - monitoring
  networkPolicy:
    enabled: true
    ingressNamespaces:
      - saas-apps
      - istio-system
      - monitoring
    allowAllEgress: false
  ciliumEgress:
    enabled: true
    rds: true
    kafka: true

rollout:
  revisionHistoryLimit: 5
  maxSurge: "25%"
  maxUnavailable: 0
  analysis:
    enabled: false
    provider: prometheus
    startingStep: 1
    interval: "1m"
    count: 5
    failureLimit: 2
    successRateThreshold: 0.99
    p95LatencyThresholdMs: 500
    prometheusAddress: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090"
    templates:
      - templateName: agent-service-success-rate
      - templateName: agent-service-latency-p95
  steps:
    - setWeight: 25
    - pause:
        duration: "30s"
    - setWeight: 50
    - pause:
        duration: "30s"
    - setWeight: 100

livenessProbe:
  path: /healthz/live
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  path: /healthz/ready
  initialDelaySeconds: 30
  periodSeconds: 5

keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  fallback: {}
  advanced: {}
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"

# Database provisioning + migrations.
#
# `enabled` (the Crossplane AppDatabase claim, templates/appdatabase.yaml) stays false:
# agent-service's RDS DB/role already exist (saas-agent-db) and the app connects with the
# SM-synced creds in the ExternalSecret above — not a Crossplane-managed owner role — so a
# claim would create a split-brain owner. Leave it off unless the service is migrated onto
# the AppDatabase contract (as billing/usage are).
#
# `migrations` DOES run: agent-service is Spring/JPA with ddl-auto=validate and ships no
# in-image migrator, so Liquibase (templates/db-migration.yaml, an Argo CD Sync hook)
# creates the baseline tables the entities validate against, BEFORE the Rollout. It
# connects with the SAME creds the app uses (the ExternalSecret-synced Secret, keys
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD). Changelog:
# charts/agent-service/migrations/changelog.sql.
database:
  enabled: false
  instance: agent            # (AppDatabase only) maps to Crossplane ProviderConfig `rds-agent`
  databaseName: agent_db
  owner: agent_app
  extensions:
    - vector                 # (AppDatabase only) pgvector, for conversation_embeddings (RAG)
  migrations:
    enabled: true
    image: liquibase/liquibase@sha256:1673fc47b5c8b852e80ccbc5162e099eafc6230c55cf144c06f1d5173f7f9d3d
    sslmode: require         # appended to SPRING_DATASOURCE_URL; RDS supports TLS
    backoffLimit: 3
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 1800
    # secretName: defaults to externalSecret.target.name (agent-service)
