---
replicas: 2
port: 8083

image:
  repository: ""
  tag: "latest"

istio:
  enabled: false
  revision: ""

serviceAccount:
  create: true
  name: ""   # defaults to the service name; must match infra kafka_clients SA

security:
  peerAuthentication:
    enabled: true
    mode: STRICT
  authorizationPolicy:
    enabled: true
    allowedNamespaces:
      - saas-apps
      - istio-system
      - monitoring
  networkPolicy:
    enabled: true
    ingressNamespaces:
      - saas-apps
      - istio-system
      - monitoring
    allowAllEgress: true

rollout:
  revisionHistoryLimit: 5
  maxSurge: "25%"
  maxUnavailable: 0
  analysis:
    enabled: false
    provider: prometheus
    startingStep: 1
    interval: "1m"
    count: 5
    failureLimit: 2
    successRateThreshold: 0.99
    p95LatencyThresholdMs: 500
    prometheusAddress: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090"
    templates:
      - templateName: agent-service-success-rate
      - templateName: agent-service-latency-p95
  steps:
    - setWeight: 25
    - pause:
        duration: "30s"
    - setWeight: 50
    - pause:
        duration: "30s"
    - setWeight: 100

livenessProbe:
  path: /healthz/live
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  path: /healthz/ready
  initialDelaySeconds: 30
  periodSeconds: 5

keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  fallback: {}
  advanced: {}
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"

# Crossplane-managed Postgres + Liquibase migrations.
# PREREQUISITE: `enabled: true` needs an `rds-agent` ProviderConfig in the Terraform
# gitops_contract (saas-services-infra) — unlike billing/usage/subscription, no rds-agent
# instance exists yet, so this stays disabled until that upstream instance is provisioned.
database:
  enabled: false
  instance: agent            # maps to Crossplane ProviderConfig `rds-agent`
  databaseName: agent_db
  owner: agent_app
  extensions:
    - vector                 # pgvector, for conversation_embeddings (RAG)
  # Liquibase runs as an Argo CD PreSync hook (templates/db-migration.yaml), migrating the
  # DB before the new Rollout starts. Changelog: charts/agent-service/migrations/changelog.sql.
  migrations:
    enabled: false
    image: liquibase/liquibase:4.31.0
    sslmode: require         # RDS enforces TLS; use "disable" only for a non-TLS local DB
    backoffLimit: 3
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 1800
    # secretName: agent-service-db   # defaults to <svc>-db from the AppDatabase claim
