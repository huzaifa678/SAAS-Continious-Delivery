---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - { key: env, operator: Exists }
  template:
    metadata:
      name: 'platform-{{.metadata.labels.env}}'
      namespace: argocd
      annotations:
        # After Crossplane operator + providers, before workloads that claim AppDatabase.
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      source:
        repoURL: https://github.com/huzaifa678/SAAS-Continious-Delivery.git
        targetRevision: main
        path: platform
        directory:
          recurse: true
      destination:
        server: '{{.server}}'
        namespace: crossplane-system
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
