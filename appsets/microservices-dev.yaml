---
# Dev-only microservices appset.
#
# Split per env (see also microservices-staging.yaml / microservices-prod.yaml).
# Dev is CONTINUOUS: argocd-image-updater auto-promotes the newest build into
# values-dev.yaml. These annotations moved here verbatim from the old shared
# appset's `templatePatch` (which guarded them with `if eq env "dev"`); since this
# appset only ever generates dev apps, the guard is no longer needed.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: microservices-dev
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          # Dev cluster only.
          - clusters:
              selector:
                matchLabels:
                  env: dev
          # Service catalogue discovered from charts/* (same as the other envs).
          - git:
              repoURL: https://github.com/huzaifa678/SAAS-Continious-Delivery.git
              revision: main
              directories:
                - path: charts/*
  # No RollingSync strategy: dev is a single cluster and is promoted continuously by
  # image-updater, so appset-level ordering would only add latency. Dev is the LEAST
  # likely env to go multi-region; the stub below is kept only for symmetry with
  # staging/prod.
  #
  # TODO(multi-region): see microservices-prod.yaml for the fully-commented rationale.
  # Prereqs: label cluster secrets with `region`, uncomment the `region` label below,
  # then add a `spec.strategy.type: RollingSync` block with region-matched steps.
  template:
    metadata:
      name: '{{.path.basename}}-{{.metadata.labels.env}}'
      namespace: argocd
      labels:
        env: '{{.metadata.labels.env}}'
        service: '{{.path.basename}}'
        # TODO(multi-region): uncomment alongside a RollingSync strategy block.
        # region: '{{.metadata.labels.region}}'
      annotations:
        argocd.argoproj.io/sync-wave: "2"
        # --- Continuous promotion (dev only) ---
        argocd-image-updater.argoproj.io/image-list: '{{.path.basename}}=533267178572.dkr.ecr.us-east-1.amazonaws.com/{{.path.basename}}'
        argocd-image-updater.argoproj.io/{{.path.basename}}.update-strategy: newest-build
        argocd-image-updater.argoproj.io/{{.path.basename}}.allow-tags: 'regexp:^sha-[0-9a-f]{7,40}$'
        argocd-image-updater.argoproj.io/{{.path.basename}}.helm.image-name: image.repository
        argocd-image-updater.argoproj.io/{{.path.basename}}.helm.image-tag: image.tag
        argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/image-updater-git-creds
        argocd-image-updater.argoproj.io/write-back-target: 'helmvalues:charts/{{.path.basename}}/values-dev.yaml'
        argocd-image-updater.argoproj.io/git-branch: main
    spec:
      project: default
      sources:
        # removing oci:// prefix from the repoURL
        - repoURL: 533267178572.dkr.ecr.us-east-1.amazonaws.com/helm
          chart: '{{.path.basename}}'
          # Floating SemVer range: each app auto-resolves the latest 0.x of its own
          # chart
          targetRevision: ">=0.1.0 <1.0.0"
          helm:
            releaseName: '{{.path.basename}}'
            valueFiles:
              - '$values/charts/{{.path.basename}}/values.yaml'
              - '$values/charts/{{.path.basename}}/values-{{.metadata.labels.env}}.yaml'
        - repoURL: https://github.com/huzaifa678/SAAS-Continious-Delivery.git
          targetRevision: main
          ref: values
      destination:
        server: '{{.server}}'
        namespace: saas-apps
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          # Server-side apply: avoids the client-side 3-way-merge + last-applied-
          # configuration annotation issues. Matches the addons/observability appsets.
          - ServerSideApply=true
          - PruneLast=true
          - ApplyOutOfSyncOnly=true
      ignoreDifferences:
        - group: argoproj.io
          kind: Rollout
          jsonPointers:
            - /spec/replicas
        - group: networking.istio.io
          kind: VirtualService
          jsonPointers:
            - /spec/http
