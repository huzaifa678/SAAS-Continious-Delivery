---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: api-gateway
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - { key: env, operator: Exists }
  template:
    metadata:
      name: 'api-gateway-{{.metadata.labels.env}}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      source:
        repoURL: https://github.com/huzaifa678/SAAS-Continious-Delivery.git
        targetRevision: main
        path: saas-chart
        helm:
          valueFiles:
            - values.yaml
            - values-{{.metadata.labels.env}}.yaml
          # Helm output is post-rendered by this Kustomize overlay before apply.
          postRenderer:
            kustomize:
              dir: post-renderer/saas-chart/overlays/{{.metadata.labels.env}}
      destination:
        server: '{{.server}}'
        namespace: saas-apps
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - ApplyOutOfSyncOnly=true
          - FailOnSharedResource=true
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: ""
          kind: Service
          jsonPointers:
            - /spec/clusterIP
  # Image Updater is dev-only: staging/prod are promoted by explicit gated PRs.
  templatePatch: |
    {{- if eq .metadata.labels.env "dev" }}
    metadata:
      annotations:
        argocd-image-updater.argoproj.io/image-list: 'apigw=123456789.dkr.ecr.us-east-1.amazonaws.com/api-gateway'
        argocd-image-updater.argoproj.io/apigw.update-strategy: newest-build
        argocd-image-updater.argoproj.io/apigw.allow-tags: 'regexp:^sha-[0-9a-f]{7,40}$'
        argocd-image-updater.argoproj.io/apigw.helm.image-spec: image.apiGateway
        argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/image-updater-git-creds
        argocd-image-updater.argoproj.io/write-back-target: 'helmvalues:saas-chart/values-dev.yaml'
        argocd-image-updater.argoproj.io/git-branch: main
    {{- end }}
