global:
  environment: dev

istio:
  enabled: false

image:
  apiGateway: ""  

apiGateway:
  replicas: 1
  circuitBreaking:
    maxConnections: 100
    http1MaxPendingRequests: 1000
    http2MaxRequests: 1000
    maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: "30s"
      baseEjectionTime: "30s"
      maxEjectionPercent: 10

opentelemetry-collector:
  enabled: true

  image:
    repository: otel/opentelemetry-collector
    tag: latest
    
  config:
    exporters:
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://monitoring.svc.cluster.local:3100/otlp
        tls:
          insecure: true
      debug:
        verbosity: detailed
      prometheus:
        endpoint: localhost:8889
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [debug, otlphttp/loki]
