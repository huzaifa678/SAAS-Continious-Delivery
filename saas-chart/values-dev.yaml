---
global:
  environment: dev

istio:
  enabled: false

image:
  apiGateway: ""

apiGateway:
  replicas: 1
  env: dev            # dev only: exposes /swagger (see main.go)
  circuitBreaking:
    maxConnections: 100
    http1MaxPendingRequests: 1000
    http2MaxRequests: 1000
    maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: "30s"
      baseEjectionTime: "30s"
      maxEjectionPercent: 10

opentelemetry-collector:
  enabled: true

  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.159.0"

  serviceAccount:
    create: true
    name: otel-collector

  extraEnvs:
    - name: KAFKA_BOOTSTRAP_SERVERS
      value: BOOTSTRAP_BROKERS

  config:
    receivers:
      kafka/logs:
        brokers: ["${env:KAFKA_BOOTSTRAP_SERVERS}"]
        topic: otel-logs
        encoding: otlp_json
        group_id: otel-logs-loki
        auth:
          sasl:
            mechanism: AWS_MSK_IAM
          tls:
            insecure: false
    exporters:
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://monitoring.svc.cluster.local:3100/otlp
        tls:
          insecure: true
      kafka/logs:
        brokers: ["${env:KAFKA_BOOTSTRAP_SERVERS}"]
        topic: otel-logs
        encoding: otlp_json
        auth:
          sasl:
            mechanism: AWS_MSK_IAM
          tls:
            insecure: false
      debug:
        verbosity: detailed
      prometheus:
        endpoint: localhost:8889
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [prometheus]
        # Producer: OTLP in -> Kafka buffer. Named `logs` (not `logs/produce`) so
        # it overrides the subchart's default logs pipeline rather than adding a
        # stray one alongside it.
        logs:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [kafka/logs]
        # Consumer (dev): Kafka buffer -> Loki.
        logs/consume:
          receivers: [kafka/logs]
          processors: [batch]
          exporters: [debug, otlphttp/loki]
