---
global:
  environment: staging

istio:
  enabled: true
  revision: ""

image:
  apiGateway: ""

apiGateway:
  replicas: 2
  circuitBreaking:
    maxConnections: 100
    http1MaxPendingRequests: 1000
    http2MaxRequests: 1000
    maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: "30s"
      baseEjectionTime: "30s"
      maxEjectionPercent: 10

opentelemetry-collector:
  enabled: true

  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.159.0"

  serviceAccount:
    create: true
    name: otel-collector

  extraEnvs:
    - name: KAFKA_BOOTSTRAP_SERVERS
      value: BOOTSTRAP_BROKERS

  config:
    exporters:
      otlp/elastic:
        endpoint: http://monitoring.svc.cluster.local:8200
        tls:
          insecure: true
      # Producer only: logs are buffered to Kafka and drained to Elasticsearch by
      # the Logstash addon (gitops/observability/elk/logstash). The previous
      # direct `elasticsearch` and `otlphttp/logstash:5000` exporters are gone —
      # the latter pointed at a Logstash that was never deployed.
      kafka/logs:
        brokers: ["${env:KAFKA_BOOTSTRAP_SERVERS}"]
        topic: otel-logs
        encoding: otlp_json
        auth:
          sasl:
            mechanism: AWS_MSK_IAM
          tls:
            insecure: false
      prometheus:
        endpoint: "0.0.0.0:8889"
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlp/elastic]
        metrics:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [kafka/logs]
