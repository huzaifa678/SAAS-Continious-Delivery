---
global:
  environment: staging

istio:
  enabled: true
  revision: ""

image:
  apiGateway: ""

apiGateway:
  replicas: 2
  circuitBreaking:
    maxConnections: 100
    http1MaxPendingRequests: 1000
    http2MaxRequests: 1000
    maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: "30s"
      baseEjectionTime: "30s"
      maxEjectionPercent: 10

opentelemetry-collector:
  enabled: true

  image:
    repository: otel/opentelemetry-collector
    tag: "0.159.0"

  config:
    exporters:
      otlp/elastic:
        endpoint: http://monitoring.svc.cluster.local:8200
        tls:
          insecure: true
      elasticsearch:
        endpoints: ["http://elasticsearch:9200"]
        logs_index: "otel-logs"
        tls:
          insecure: true
      otlphttp/logstash:
        endpoint: http://logstash:5000
      prometheus:
        endpoint: "0.0.0.0:8889"
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlp/elastic]
        metrics:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [elasticsearch, otlphttp/logstash]
