---
global:
  environment: dev

istio:
  enabled: false
  revision: ""

appName: saas
gatewayClass: nginx

tlsSecretName:
  http: saas-app-api-tls

gateway:
  nlbTarget: ""

domainName:
  http: ""

apiService: saas-api-service

services:
  auth:
    name: auth-service
  subscription:
    name: subscription-service
  billing:
    name: billing-service

image:
  apiGateway: ""

apiGateway:
  replicas: 2
  port: 9000
  # Secure default: Swagger/OpenAPI off. Only values-dev.yaml sets env: dev.
  env: prod
  # keycloakx client-facing Service is keycloak-http on port 80 (was Bitnami keycloak:8080).
  keycloakJWKSURL: "http://keycloak-http.keycloak.svc.cluster.local:80/realms/saas/protocol/openid-connect/certs"
  livenessProbe:
    path: /healthz/live
    initialDelaySeconds: 10
    periodSeconds: 10
  readinessProbe:
    path: /healthz/ready
    initialDelaySeconds: 5
    periodSeconds: 5
  blueGreen:
    activeSlot: blue
    previewSlot: green
    previewImage: ""
    activeWeight: 100
    previewWeight: 0
  circuitBreaking:
    maxConnections: 100
    http1MaxPendingRequests: 1000
    http2MaxRequests: 1000
    maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: "30s"
      baseEjectionTime: "30s"
      maxEjectionPercent: 10

opentelemetry-collector:
  enabled: true
  mode: daemonset

  image:
    # contrib distro is required: the core `otel/opentelemetry-collector` image
    # does NOT ship the kafka exporter/receiver (nor the elasticsearch exporter
    # used in staging/prod). Everything else stays as before.
    repository: otel/opentelemetry-collector-contrib
    # Pinned to the chart's appVersion (no floating `latest`).
    tag: "0.159.0"

  # EKS Pod Identity grants MSK SASL/IAM access — no role-arn annotation. The
  # binding is defined in Terraform (layers/20-data kafka_clients "otel-collector",
  # namespace saas-apps / SA otel-collector) via aws_eks_pod_identity_association.
  serviceAccount:
    create: true
    name: otel-collector

  # Broker list comes from the gitops contract (kafka.bootstrap_brokers_sasl_iam),
  # same BOOTSTRAP_BROKERS placeholder used by infra/base/usage-etl-argo-keda.
  extraEnvs:
    - name: KAFKA_BOOTSTRAP_SERVERS
      value: BOOTSTRAP_BROKERS

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # Consumer side (dev): read the buffered logs back out of Kafka and ship
      # them to Loki. staging/prod use Logstash for this instead (see the elk
      # logstash addon), so they do not enable this receiver.
      kafka/logs:
        brokers: ["${env:KAFKA_BOOTSTRAP_SERVERS}"]
        topic: otel-logs
        # otlp_json (not otlp_proto) so the same topic can also be consumed by
        # Logstash's json codec in staging/prod.
        encoding: otlp_json
        group_id: otel-logs-loki
        auth:
          sasl:
            mechanism: AWS_MSK_IAM
          tls:
            insecure: false

    processors:
      batch: {}
      resource:
        attributes:
          - key: service.name
            from_attribute: service.name
            action: insert

    exporters:
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://loki:3100/otlp
        tls:
          insecure: true
      # Producer side: buffer all logs onto the MSK topic. Every service already
      # emits OTLP, so this single change buffers logs for all of them at once.
      kafka/logs:
        brokers: ["${env:KAFKA_BOOTSTRAP_SERVERS}"]
        topic: otel-logs
        encoding: otlp_json
        auth:
          sasl:
            mechanism: AWS_MSK_IAM
          tls:
            insecure: false
      debug:
        verbosity: detailed
      prometheus:
        endpoint: localhost:8889

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [prometheus]
        # Producer: OTLP in -> Kafka buffer. Named `logs` (not `logs/produce`) so
        # it overrides the subchart's default logs pipeline rather than adding a
        # stray one alongside it.
        logs:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [kafka/logs]
        # Consumer (dev): Kafka buffer -> Loki.
        logs/consume:
          receivers: [kafka/logs]
          processors: [batch]
          exporters: [debug, otlphttp/loki]
