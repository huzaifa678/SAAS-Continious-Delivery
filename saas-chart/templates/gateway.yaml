---
{{- if .Values.gateway.enabled }}
# Explicit TLS cert for the public API host, issued by the shared cert-manager
# ClusterIssuer. Replaces the Gateway's cert-manager.io/cluster-issuer annotation
# so a single Certificate manages the {{ .Values.tlsSecretName.http }} secret —
# consistent with the argocd/grafana/keycloak/backstage gateways.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.tlsSecretName.http }}
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Values.tlsSecretName.http }}
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.domainName.http | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.appName }}-gateway
  {{- with .Values.gateway.nlbTarget }}
  annotations:
    external-dns.alpha.kubernetes.io/target: {{ . | quote }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gatewayClass }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.domainName.http }}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.domainName.http }}
      tls:
        certificateRefs:
          - name: {{ .Values.tlsSecretName.http }}
{{- end }}
