---
global:
  environment: prod

istio:
  enabled: true
  revision: ""

image:
  repository: "533267178572.dkr.ecr.us-east-1.amazonaws.com/api-gateway"
  tag: "prod"

apiGateway:
  replicas: 3
  blueGreen:
    activeSlot: blue
    previewSlot: green
    previewImage: ""
    activeWeight: 100
    previewWeight: 0

opentelemetry-collector:
  enabled: true

  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.159.0"

  serviceAccount:
    create: true
    name: otel-collector

  extraEnvs:
    - name: KAFKA_BOOTSTRAP_SERVERS
      value: BOOTSTRAP_BROKERS

  config:
    # prod drains Kafka to Elasticsearch via the Logstash addon, so the base
    # values' dev-only in-collector consumer (Kafka -> Loki) is disabled here.
    receivers:
      kafka/logs: null
    exporters:
      # Disable the dev-only exporters inherited from values.yaml (the Kafka -> Loki
      # consumer used loki/debug; tempo backed the dev traces pipeline, dropped below).
      otlp/tempo: null
      otlphttp/loki: null
      debug: null
      # Producer only: logs are buffered to Kafka and drained to Elasticsearch by
      # the Logstash addon (gitops/observability/elk/logstash).
      kafka/logs:
        brokers: ["${env:KAFKA_BOOTSTRAP_SERVERS}"]
        # Per-signal block: recent kafka exporter versions reject top-level topic/encoding.
        logs:
          topic: otel-logs
          encoding: otlp_json
        auth:
          sasl:
            mechanism: AWS_MSK_IAM
          tls:
            insecure: false
      prometheus:
        endpoint: "0.0.0.0:8889"
    service:
      pipelines:
        # Drop dev-only pipelines inherited from values.yaml: the Kafka -> Loki
        # consumer, and traces -> otlp/tempo (prod ships no traces here, and the
        # otlp/tempo exporter is disabled above — leaving it would reference a
        # non-existent exporter and fail config load).
        logs/consume: null
        traces: null
        metrics:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [kafka/logs]
