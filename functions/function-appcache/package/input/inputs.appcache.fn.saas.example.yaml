apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: inputs.appcache.fn.saas.example
spec:
  group: appcache.fn.saas.example
  names:
    categories:
      - crossplane
    kind: Input
    listKind: InputList
    plural: inputs
    singular: input
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: Input configures the function-appcache composition function.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            providerConfigName:
              type: string
              description: provider-aws ProviderConfig every composed ElastiCache resource references. Defaults to "aws-elasticache".
            defaultUserGroupId:
              type: string
              description: Shared cluster RBAC user group a shared-mode tenant joins when the claim omits userGroupId. Defaults to "saas-redis".
