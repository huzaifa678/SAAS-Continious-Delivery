apiVersion: meta.pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-appcache
  annotations:
    meta.crossplane.io/maintainer: SaaS Platform <platform@saas.example>
    meta.crossplane.io/source: github.com/huzaifa678/SAAS-Continious-Delivery
    meta.crossplane.io/description: |
      Composes the provider-aws ElastiCache resources for the
      platform.saas.example XAppCache API — a prefix-scoped RBAC User on the
      shared cluster (shared mode) or a dedicated ReplicationGroup with its own
      user group (dedicated mode). Replaces function-patch-and-transform with
      real Go.
spec:
  # Functions target the GA function protocol (proto/v1), Crossplane >= 1.14.
  crossplane:
    version: ">=v1.14.0"
