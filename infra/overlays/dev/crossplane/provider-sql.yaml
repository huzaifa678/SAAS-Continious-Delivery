---
# ═══════════════════════════════════════════════════════════════════════════
# Crossplane provider that manages Postgres-level resources (Database, Role,
# Grant) over a direct SQL connection. Does NOT talk to AWS APIs — no IRSA
# needed. One Provider per cluster, one ProviderConfig per RDS instance.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-sql
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-sql:v0.10.0
  packagePullPolicy: IfNotPresent
  revisionActivationPolicy: Automatic
  revisionHistoryLimit: 1

# ═══════════════════════════════════════════════════════════════════════════
# One ExternalSecret + ProviderConfig per RDS instance.
#
# Secret names come from saas-services-infra modules/rds/main.tf:
#   resource "aws_secretsmanager_secret" "db" { name = "${var.name}-secret" }
# and main.tf passes `name = "saas-<svc>-db"` per module.
#
# Note: rds_auth and rds_keycloak are conditional in TF based on
# var.auth_provider — only one of them exists per env. The non-matching
# ProviderConfig will report unhealthy (no Secret to bind); this is expected
# and harmless. AppDatabase claims naturally won't target a missing instance
# because the schema's `instance` enum is validated at PR time.
# ═══════════════════════════════════════════════════════════════════════════

# ─── auth-service ────────────────────────────────────────────────────────────
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rds-auth-admin
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rds-auth-admin
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        data: |
          postgresql://{{ .username }}:{{ .password }}@{{ .endpoint }}/{{ .db_name }}?sslmode=require
        username: "{{ .username }}"
        password: "{{ .password }}"
        endpoint: "{{ .endpoint }}"
        db_name: "{{ .db_name }}"
  data:
    - { secretKey: username, remoteRef: { key: saas-auth-db-secret, property: username } }
    - { secretKey: password, remoteRef: { key: saas-auth-db-secret, property: password } }
    - { secretKey: endpoint, remoteRef: { key: saas-auth-db-secret, property: endpoint } }
    - { secretKey: db_name,  remoteRef: { key: saas-auth-db-secret, property: db_name  } }
---
apiVersion: postgresql.sql.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: rds-auth
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  credentials:
    source: PostgreSQLConnectionSecret
    connectionSecretRef:
      namespace: crossplane-system
      name: rds-auth-admin
  sslMode: require

