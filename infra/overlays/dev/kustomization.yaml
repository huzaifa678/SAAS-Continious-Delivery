---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Helm addons (keda, argo-rollouts, crossplane operator, airflow, image-updater)
# moved to the flattened `addons` ApplicationSet. This overlay now delivers only
# raw platform manifests: the crossplane provider-sql wiring (contract-generated)
# and the pod-identity-refresh app (from base).
resources:
  - ../../base
  - crossplane/provider-sql.yaml
