apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local minikube variant of the dev overlay.
# Differences vs ../dev:
#   - Excludes crossplane/provider-sql.yaml (relies on ExternalSecrets +
#     AWS Secrets Manager + real RDS endpoints; won't reconcile locally).
#   - Crossplane operator itself stays installed so AppDatabase XRD/Composition
#     can still be loaded for shape validation.
# Application yamls are duplicated from ../dev because kustomize forbids
# referencing files outside the overlay directory.
resources:
  - ../../base
  - observability/application-prometheus.yaml
  - observability/application-loki.yaml
  - keda/application-keda.yaml
  - argo-rollouts/application-argo-rollouts.yaml
  - crossplane/application-crossplane.yaml
