---
# Airflow orchestrator (ACTIVE ETL execution — Option A).
#
# executor: KubernetesExecutor — every task runs as its own pod, so there is no
# Celery worker pool and no Redis broker to run. Metadata DB is the dedicated
# airflow RDS instance, managed via Crossplane: the AppDatabase claim
# (appdatabase.yaml) writes the `airflow-db` Secret with a `dsn`, injected at
# runtime below, so this manifest is environment-agnostic (no baked-in endpoint).
#
# Alternative (Option B, Argo Workflows + KEDA, mutually exclusive):
# infra/base/usage-etl-argo-keda/ (guide: /ARGOWORKFLOWS.md). Do NOT enable both.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://airflow-helm.github.io/charts
    chart: airflow
    targetRevision: "*"
    helm:
      releaseName: airflow
      values: |
        executor: KubernetesExecutor
        postgresql:
          enabled: false
        redis:
          enabled: false
        airflow:
          extraEnv:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: airflow-db
                  key: dsn
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
