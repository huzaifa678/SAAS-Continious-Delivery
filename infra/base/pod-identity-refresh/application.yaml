---
# Argo CD Application that owns a one-shot "restart everything using Pod Identity"
# Job. Used after IAM trust-policy changes (e.g. IRSA -> Pod Identity migration) so
# running pods drop their cached IRSA credentials and pick up the new auth path.
#
# How to trigger:
#   - argocd app sync pod-identity-refresh        # CLI
#   - or click "Sync" in the Argo CD UI
#   - or bump the annotation below and let Argo auto-sync
#
# The Job carries `argocd.argoproj.io/hook: Sync` so it runs as a Sync hook
# (not a normal resource) and is recreated cleanly on each sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pod-identity-refresh
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    # Bump this when you want to force a refresh without a code change.
    # e.g. `kubectl -n argocd annotate app pod-identity-refresh refresh.saas/run="$(date +%s)" --overwrite`
    refresh.saas/run: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/huzaifa678/SAAS-Continious-Delivery.git
    targetRevision: HEAD
    path: infra/base/pod-identity-refresh/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
