---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  annotations:
    # Control-plane addon — installs before workloads so it can start reconciling
    # image annotations immediately.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 0.12.0
    helm:
      releaseName: argocd-image-updater
      values: |
        config:
          logLevel: info
          # Poll ECR for new tags. `credentials: ext:...` shells out to the AWS CLI
          # for a fresh ECR token; the image-updater ServiceAccount must carry IRSA
          # with ecr:GetAuthorizationToken + ecr:BatchGetImage (see docs/IMAGE-UPDATER.md).
          registries:
            - name: ECR
              prefix: 123456789.dkr.ecr.us-east-1.amazonaws.com
              api_url: https://123456789.dkr.ecr.us-east-1.amazonaws.com
              ping: true
              credentials: ext:/scripts/ecr-login.sh
              credsexpire: 10h
        # git write-back identity (commits the new tag to this Git repo).
        gitCommitUser: argocd-image-updater
        gitCommitMail: image-updater@saas.local
        authScripts:
          enabled: true
          scripts:
            ecr-login.sh: |
              #!/bin/sh
              aws ecr --region us-east-1 get-authorization-token \
                --output text --query 'authorizationData[].authorizationToken' \
                | base64 -d
        serviceAccount:
          create: true
          annotations:
            # Replace with the IRSA role ARN granted ECR read (see docs).
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/argocd-image-updater
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
