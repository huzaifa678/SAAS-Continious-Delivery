apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: staging

patches:
  - target:
      kind: DaemonSet
      name: cilium
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: cilium
      spec:
        template:
          spec:
            containers:
              - name: cilium
                resources:
                  requests:
                    cpu: 200m
                    memory: 512Mi
                  limits:
                    cpu: 1000m
                    memory: 1Gi