apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: dev

patches:
  - target:
      kind: DaemonSet
      name: cilium
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: cilium
      spec:
        template:
          spec:
            containers:
              - name: cilium
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi