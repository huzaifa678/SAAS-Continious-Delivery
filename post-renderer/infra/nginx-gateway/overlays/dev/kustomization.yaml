---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: dev

patches:
  - target: { kind: Deployment, name: nginx-gateway-nginx-gateway-fabric }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nginx-gateway-nginx-gateway-fabric
      spec:
        template:
          spec:
            containers:
              - name: nginx-gateway
                resources:
                  requests: { cpu: 25m, memory: 32Mi }
                  limits: { cpu: 125m, memory: 128Mi }
