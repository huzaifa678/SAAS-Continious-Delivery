---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: dev

patches:
  - target: { kind: Deployment, name: external-secrets }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: external-secrets
      spec:
        template:
          spec:
            containers:
              - name: external-secrets
                resources:
                  requests: { cpu: 25m, memory: 32Mi }
                  limits: { cpu: 125m, memory: 64Mi }
