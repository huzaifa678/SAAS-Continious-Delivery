---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: prod

patches:
  - target: { kind: Deployment, name: aws-lb-controller-aws-load-balancer-controller }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: aws-lb-controller-aws-load-balancer-controller
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: aws-load-balancer-controller
                resources:
                  requests: { cpu: 100m, memory: 128Mi }
                  limits: { cpu: 500m, memory: 256Mi }
