---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: prod

patches:
  - target: { kind: Deployment, name: keda-operator }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: keda-operator
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: keda-operator
                resources:
                  requests: { cpu: 100m, memory: 128Mi }
                  limits: { cpu: 500m, memory: 512Mi }
