---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: prod

patches:
  - target: { kind: Deployment, name: airflow-scheduler }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: airflow-scheduler
      spec:
        template:
          spec:
            containers:
              - name: airflow-scheduler
                resources:
                  requests: { cpu: 250m, memory: 512Mi }
                  limits: { cpu: 1000m, memory: 1024Mi }
