---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: staging

patches:
  - target: { kind: Deployment, name: crossplane }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: crossplane
      spec:
        template:
          spec:
            containers:
              - name: crossplane
                resources:
                  requests: { cpu: 50m, memory: 128Mi }
                  limits: { cpu: 250m, memory: 256Mi }
