---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: dev

patches:
  - target: { kind: Deployment, name: argo-rollouts }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argo-rollouts
      spec:
        template:
          spec:
            containers:
              - name: argo-rollouts
                resources:
                  requests: { cpu: 25m, memory: 32Mi }
                  limits: { cpu: 125m, memory: 128Mi }
