---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: prod

patches:
  - target: { kind: Deployment, name: argocd-image-updater }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-image-updater
      spec:
        template:
          spec:
            containers:
              - name: argocd-image-updater
                resources:
                  requests: { cpu: 50m, memory: 64Mi }
                  limits: { cpu: 200m, memory: 128Mi }
