---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: dev

patches:
  - target: { kind: StatefulSet, name: keycloak }
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: keycloak
      spec:
        template:
          spec:
            containers:
              - name: keycloak
                resources:
                  requests: { cpu: 125m, memory: 256Mi }
                  limits: { cpu: 250m, memory: 512Mi }
