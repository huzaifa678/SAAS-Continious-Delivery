---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: staging

patches:
  - target: { kind: StatefulSet, name: keycloak }
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: keycloak
      spec:
        template:
          spec:
            containers:
              - name: keycloak
                resources:
                  requests: { cpu: 250m, memory: 512Mi }
                  limits: { cpu: 500m, memory: 1024Mi }
