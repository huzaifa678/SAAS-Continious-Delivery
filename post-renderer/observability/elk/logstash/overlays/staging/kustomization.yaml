---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: staging

patches:
  - target: { kind: StatefulSet, name: logstash-logstash }
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: logstash-logstash
      spec:
        template:
          spec:
            containers:
              - name: logstash
                resources:
                  requests: { cpu: 200m, memory: 1Gi }
                  limits: { cpu: 500m, memory: 2Gi }
