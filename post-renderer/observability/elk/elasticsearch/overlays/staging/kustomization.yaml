---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: staging

patches:
  - target: { kind: StatefulSet, name: elasticsearch-master }
    patch: |-
      - op: add
        path: /metadata/annotations/policy.saas.io~1allow-host-access
        value: "true"
  - target: { kind: StatefulSet, name: elasticsearch-master }
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: elasticsearch-master
      spec:
        template:
          spec:
            containers:
              - name: elasticsearch
                resources:
                  requests: { cpu: 500m, memory: 1Gi }
                  limits: { cpu: 1000m, memory: 2Gi }
