---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: dev

patches:
  - target: { kind: DaemonSet, name: loki-stack-promtail }
    patch: |-
      - op: add
        path: /metadata/annotations/policy.saas.io~1allow-host-access
        value: "true"
  - target: { kind: StatefulSet, name: loki-stack }
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: loki-stack
      spec:
        template:
          spec:
            containers:
              - name: loki
                resources:
                  requests: { cpu: 100m, memory: 128Mi }
                  limits: { cpu: 500m, memory: 512Mi }
