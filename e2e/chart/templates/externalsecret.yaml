{{- if .Values.externalSecret.enabled -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "saas-e2e.fullname" . }}-env
  labels:
    {{- include "saas-e2e.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "saas-e2e.fullname" . }}-env
    creationPolicy: Owner
  data:
    {{- range $envKey, $prop := .Values.externalSecret.data }}
    - secretKey: {{ $envKey }}
      remoteRef:
        key: {{ $.Values.externalSecret.remoteKey }}
        property: {{ $prop }}
    {{- end }}
{{- end }}
