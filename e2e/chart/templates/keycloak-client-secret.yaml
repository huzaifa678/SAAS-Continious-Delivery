{{- if .Values.keycloakClientGen.enabled }}
{{- $g := .Values.keycloakClientGen }}
# ─────────────────────────────────────────────────────────────────────────────
# In-cluster generation of the saas-e2e Keycloak client secret — mirrors
# gitops/infra/backstage secret-generation. A PreSync hook reads the client
# secret from Keycloak's admin API (creating the client if the realm import
# hasn't) and writes E2E_KEYCLOAK_CLIENT_ID + E2E_KEYCLOAK_CLIENT_SECRET into the
# {{ $g.targetSecret }} Secret, which the smoke Job envFroms. Nothing is printed
# or sent to AWS; the client secret never lives in git/SOPS.
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saas-e2e-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "saas-e2e.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: saas-e2e-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "saas-e2e.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: saas-e2e-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "saas-e2e.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: saas-e2e-bootstrap }
subjects:
  - { kind: ServiceAccount, name: saas-e2e-bootstrap, namespace: {{ .Release.Namespace }} }
---
# Read ONLY the Keycloak admin secret, cross-namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: saas-e2e-bootstrap-kc
  namespace: {{ $g.keycloak.namespace }}
  labels:
    {{- include "saas-e2e.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $g.keycloak.adminSecret }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: saas-e2e-bootstrap-kc
  namespace: {{ $g.keycloak.namespace }}
  labels:
    {{- include "saas-e2e.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: saas-e2e-bootstrap-kc }
subjects:
  - { kind: ServiceAccount, name: saas-e2e-bootstrap, namespace: {{ .Release.Namespace }} }
---
# Wave -2: ensure the saas-e2e client exists and publish its id + secret.
apiVersion: batch/v1
kind: Job
metadata:
  name: saas-e2e-keycloak-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "saas-e2e.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: {{ $g.backoffLimit }}
  activeDeadlineSeconds: {{ $g.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ $g.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "saas-e2e.labels" . | nindent 8 }}
      annotations: { sidecar.istio.io/inject: "false" }
    spec:
      restartPolicy: Never
      serviceAccountName: saas-e2e-bootstrap
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: provision
          image: {{ $g.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: KC_URL,          value: {{ $g.keycloak.url | quote }} }
            - { name: KC_NS,           value: {{ $g.keycloak.namespace | quote }} }
            - { name: KC_ADMIN_SECRET, value: {{ $g.keycloak.adminSecret | quote }} }
            - { name: REALM,           value: {{ $g.keycloak.realm | quote }} }
            - { name: CLIENT_ID,       value: {{ $g.keycloak.clientId | quote }} }
            - { name: TARGET_SECRET,   value: {{ $g.targetSecret | quote }} }
            - { name: TARGET_NS,       value: {{ .Release.Namespace | quote }} }
            - { name: HOME,            value: /tmp }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ADMIN_PW="$(kubectl get secret "$KC_ADMIN_SECRET" -n "$KC_NS" -o jsonpath='{.data.password}' | base64 -d)"
              TOKEN="$(curl -fsS "$KC_URL/realms/master/protocol/openid-connect/token" \
                -d grant_type=password -d client_id=admin-cli -d username=admin \
                --data-urlencode "password=$ADMIN_PW" | jq -r .access_token)"
              [ -n "$TOKEN" ] && [ "$TOKEN" != null ] || { echo "keycloak admin auth failed"; exit 1; }
              auth="Authorization: Bearer $TOKEN"
              uuid="$(curl -fsS -H "$auth" "$KC_URL/admin/realms/$REALM/clients?clientId=$CLIENT_ID" | jq -r '.[0].id // empty')"
              if [ -z "$uuid" ]; then
                echo "creating confidential service-account client $CLIENT_ID in realm $REALM"
                curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
                  "$KC_URL/admin/realms/$REALM/clients" -d "$(jq -nc --arg c "$CLIENT_ID" \
                    '{clientId:$c, protocol:"openid-connect", publicClient:false, serviceAccountsEnabled:true, standardFlowEnabled:false, directAccessGrantsEnabled:false, clientAuthenticatorType:"client-secret"}')"
                uuid="$(curl -fsS -H "$auth" "$KC_URL/admin/realms/$REALM/clients?clientId=$CLIENT_ID" | jq -r '.[0].id // empty')"
              fi
              [ -n "$uuid" ] || { echo "client lookup failed"; exit 1; }
              SECRET="$(curl -fsS -H "$auth" "$KC_URL/admin/realms/$REALM/clients/$uuid/client-secret" | jq -r '.value // empty')"
              if [ -z "$SECRET" ]; then
                SECRET="$(curl -fsS -X POST -H "$auth" "$KC_URL/admin/realms/$REALM/clients/$uuid/client-secret" | jq -r '.value')"
              fi
              [ -n "$SECRET" ] && [ "$SECRET" != null ] || { echo "no client secret"; exit 1; }
              kubectl patch secret "$TARGET_SECRET" -n "$TARGET_NS" --type merge \
                -p "$(jq -nc --arg id "$CLIENT_ID" --arg v "$SECRET" '{stringData:{E2E_KEYCLOAK_CLIENT_ID:$id, E2E_KEYCLOAK_CLIENT_SECRET:$v}}')" 2>/dev/null \
                || kubectl create secret generic "$TARGET_SECRET" -n "$TARGET_NS" \
                     --from-literal=E2E_KEYCLOAK_CLIENT_ID="$CLIENT_ID" \
                     --from-literal=E2E_KEYCLOAK_CLIENT_SECRET="$SECRET"
              echo "published E2E_KEYCLOAK_CLIENT_ID + E2E_KEYCLOAK_CLIENT_SECRET"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
{{- end }}
