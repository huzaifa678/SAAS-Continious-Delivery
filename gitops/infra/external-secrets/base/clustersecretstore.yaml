---
# The AWS Secrets Manager ClusterSecretStore referenced by every ExternalSecret
# in the repo (e.g. crossplane provider-sql's rds-*-admin secrets). Previously
# assumed to exist out-of-band; now delivered with the external-secrets addon.
#
# Auth is via the external-secrets controller ServiceAccount, which is bound to
# an IAM role granting secretsmanager:GetSecretValue through EKS Pod Identity /
# IRSA (provisioned in Terraform, not here). Synced after the operator + CRDs are
# up; SkipDryRunOnMissingResource lets ArgoCD retry until the CRD exists.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
