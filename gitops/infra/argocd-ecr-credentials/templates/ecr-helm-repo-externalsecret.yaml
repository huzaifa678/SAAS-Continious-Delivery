{{- $r := .Values.ecrHelmRepo }}
---
# Mints a short-lived ECR authorization token using the external-secrets
# controller's ambient AWS credentials (EKS Pod Identity on the external-secrets
# SA). The role needs ecr:GetAuthorizationToken plus pull on repository/helm/*.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ECRAuthorizationToken
metadata:
  name: ecr-helm-token
  namespace: {{ .Release.Namespace }}
spec:
  region: {{ $r.region | quote }}
---
# Renders that token into an ArgoCD repository Secret and refreshes it every
# refreshInterval, so OCI Helm chart pulls never hit an expired token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-ecr-helm-repo
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ $r.refreshInterval | quote }}
  target:
    name: argocd-ecr-helm-repo
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          # repo-creds (not repository): a prefix-matched credential TEMPLATE. The
          # charts are per-chart OCI repos (oci://<registry>/helm/<svc>), so an
          # exact-match `repository` entry for <registry>/helm never applies to the
          # <registry>/helm/<svc> pulls ArgoCD reports "basic credential not found".
          # repo-creds matches every repo under the url prefix, covering all charts.
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: helm
        url: {{ printf "%s/%s" $r.registry $r.repoPath | quote }}
        enableOCI: "true"
        # ESO template refs (v2 engine) — escaped so Helm emits them verbatim for
        # External Secrets to fill from the generator output.
        username: "{{ `{{ .username }}` }}"
        password: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: ecr-helm-token
