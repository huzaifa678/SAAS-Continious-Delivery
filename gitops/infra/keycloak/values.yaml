# Contract delivery (docs/gitops-contract-delivery-modes.md):
#   render mode -> database.hostname is injected per env into
#                  values-<env>.generated.yaml (render_gitops.py), prod only.
#   eso mode    -> gitopsContract.eso.enabled=true (values-<env>.eso.yaml) creates
#                  the keycloak-contract ExternalSecret and feeds KC_DB_URL_HOST via
#                  keycloakx.extraEnvFrom instead (database.hostname left unset).
# Default off so this base is render-mode-safe.
gitopsContract:
  eso:
    enabled: false
    # secretName: saas/<env>/infra-contract   # set in values-<env>.eso.yaml
    secretStore: aws-secrets-manager

# keycloak-postgres-secret (postgresql-user/password) — pulled from the infra
# per-DB Secrets Manager secret via External Secrets. Needed in every env (DB
# credentials, independent of the gitops-contract delivery mode).
databaseSecret:
  enabled: true
  remoteName: keycloak-db-secret
  secretStore: aws-secrets-manager

# keycloak-admin-secret (password) — the bootstrap admin password that
# keycloakx.extraEnv wires into KC_BOOTSTRAP_ADMIN_PASSWORD. Materialized the
# same way as the DB secret (External Secrets, every env), so the StatefulSet is
# not left in CreateContainerConfigError waiting for a hand-created Secret.
# remoteName/remoteKey point at the AWS Secrets Manager secret + JSON property;
# the dedicated secret keeps the bootstrap credential out of the shared
# infra-contract. Create it on the infra side, e.g.:
#   aws secretsmanager create-secret --name keycloak-admin-secret \
#     --secret-string '{"password":"<generated>"}'
adminSecret:
  enabled: true
  remoteName: keycloak-admin-secret
  remoteKey: password
  secretStore: aws-secrets-manager

# Import the saas realm (clients/roles) on Keycloak startup, from
# files/saas-realm.json via the keycloak-realm-import ConfigMap. Without it the
# realm is empty and api-gateway/backstage OIDC 404 on /realms/saas/... .
realmImport:
  enabled: true

keycloakx:
  fullnameOverride: keycloak

  command:
    - "/opt/keycloak/bin/kc.sh"
    - "start"
    - "--http-enabled=true"
    - "--hostname-strict=false"
    - "--health-enabled=true"
    - "--metrics-enabled=true"
    # Import the saas realm from /opt/keycloak/data/import on startup (mounted
    # below from the keycloak-realm-import ConfigMap). Keycloak only imports a
    # realm that does not already exist, so this is safe on every restart.
    - "--import-realm"
  proxy:
    enabled: true
    mode: forwarded
  http:
    relativePath: "/"

  # Mount the saas realm export so --import-realm can load it. The ConfigMap is
  # rendered by this umbrella chart (templates/realm-import-configmap.yaml) from
  # files/saas-realm.json.
  extraVolumes: |
    - name: realm-import
      configMap:
        name: keycloak-realm-import
  extraVolumeMounts: |
    - name: realm-import
      mountPath: /opt/keycloak/data/import
      readOnly: true

  database:
    vendor: postgres
    port: 5432
    database: keycloak_db
    username: keycloak_user
    existingSecret: keycloak-postgres-secret
    existingSecretKey: postgresql-password

  # Bootstrap admin (Keycloak 26 uses KC_BOOTSTRAP_ADMIN_*). Password from a
  # secret (keycloak-admin-secret/password) — provide it via external-secrets or
  # manually, the same way keycloak-postgres-secret is provided.
  extraEnv: |
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      value: admin
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-admin-secret
          key: password

  service:
    httpPort: 80

# In-cluster Postgres (templates/postgres.yaml) for non-prod; prod uses RDS.
inClusterDb:
  enabled: false
# Public hostname for the Keycloak gateway + TLS cert (per-env; prod default here,
# overridden in values-staging.yaml). Must match the backstage-app secret's
# KEYCLOAK_METADATA_URL host (saas-services-infra backstage module).
host: keycloak.freeeasycrypto.com

# Shared cert-manager ClusterIssuer (gitops/infra/cert-manager) — same one
# argocd/grafana/backstage use for their gateway TLS.
issuer: letsencrypt

# TLS gateway/HTTPRoute (templates/gateway.yaml) — enabled in staging + prod so
# Keycloak is externally reachable for browser OIDC (Backstage etc.).
gateway:
  enabled: false
