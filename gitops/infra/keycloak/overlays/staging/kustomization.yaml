---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # In-cluster Postgres for non-prod (relocated from infra/base/keycloak).
  - ../../db

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: keycloak-helm
    patch: |-
      - op: replace
        path: /spec/source/helm/parameters/1/value
        value: keycloak-postgres.keycloak.svc.cluster.local
