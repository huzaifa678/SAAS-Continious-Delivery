---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # Prod TLS gateway/HTTPRoute (relocated from infra/overlays/prod/keycloak).
  - gateway.yaml

# externalDatabase.host rendered from the Terraform gitops_contract
# (databases.keycloak.endpoint). Regenerated per env by the render-gitops workflow.
patches:
  - path: db-host.generated.yaml
    target: { group: argoproj.io, version: v1alpha1, kind: Application, name: keycloak-helm }
