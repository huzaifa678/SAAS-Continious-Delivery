{{- if .Values.databaseSecret.enabled }}
# Materializes keycloak-postgres-secret (postgresql-user / postgresql-password)
# from the infra per-DB Secrets Manager secret (modules/rds "<name>-secret", keys
# username/password). Both the in-cluster Postgres (templates/postgres.yaml) and
# the keycloakx chart (database.existingSecret) read this, in every env — so it is
# NOT gated on the eso delivery mode (that toggle only governs the cluster-identity
# contract, not DB credentials, which always flow through External Secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-postgres-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    # Ahead of the keycloak StatefulSet and the in-cluster Postgres Deployment so
    # the Secret they mount exists first.
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.databaseSecret.secretStore | default "aws-secrets-manager" }}
    kind: ClusterSecretStore
  target:
    name: keycloak-postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: postgresql-user
      remoteRef:
        key: {{ .Values.databaseSecret.remoteName | default "keycloak-db-secret" }}
        property: username
    - secretKey: postgresql-password
      remoteRef:
        key: {{ .Values.databaseSecret.remoteName | default "keycloak-db-secret" }}
        property: password
{{- end }}
