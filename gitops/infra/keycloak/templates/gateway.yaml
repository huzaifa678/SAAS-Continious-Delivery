{{- if .Values.gateway.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  labels:
    cert-manager.io/disable-validation: "true"
---
# TLS cert issued by the SHARED cert-manager ClusterIssuer (gitops/infra/cert-manager),
# the same one argocd/grafana/backstage use — set via .Values.issuer. No bespoke
# per-app ClusterIssuer.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: keycloak
spec:
  secretName: keycloak-tls
  issuerRef:
    name: {{ .Values.issuer }}
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.host | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: keycloak-gateway
  namespace: keycloak
  {{- with .Values.nlbTarget }}
  annotations:
    # external-dns publishes this record to the internet-facing nginx-gateway-lb NLB.
    # NGF's own data-plane LB is internal and can't be annotated in this NGF version, so
    # DNS points at the manual NLB — the same external-dns target pattern as saas-gateway.
    external-dns.alpha.kubernetes.io/target: {{ . | quote }}
  {{- end }}
spec:
  gatewayClassName: nginx
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: {{ .Values.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: keycloak-tls
            kind: Secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - name: keycloak-gateway
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - backendRefs:
        # keycloakx's client-facing Service (chart fullnameOverride: keycloak).
        - name: keycloak-http
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway-lb
  namespace: keycloak
  annotations:
    # Managed by the AWS Load Balancer Controller. The legacy "nlb" value uses the
    # in-tree provider, which ignores aws-load-balancer-scheme and defaulted to an
    # INTERNAL NLB on private subnets. "external" honors the scheme and places the
    # NLB on the kubernetes.io/role/elb public subnets.
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    gateway.networking.k8s.io/gateway-name: keycloak-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
{{- end }}
