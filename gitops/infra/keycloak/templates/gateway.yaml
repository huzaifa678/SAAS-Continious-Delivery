{{- if .Values.gateway.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  labels:
    cert-manager.io/disable-validation: "true"
---
# TLS cert issued by the SHARED cert-manager ClusterIssuer (gitops/infra/cert-manager),
# the same one argocd/grafana/backstage use — set via .Values.issuer. No bespoke
# per-app ClusterIssuer.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: keycloak
spec:
  secretName: keycloak-tls
  issuerRef:
    name: {{ .Values.issuer }}
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.host | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: keycloak-gateway
  namespace: keycloak
spec:
  gatewayClassName: nginx
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: {{ .Values.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: keycloak-tls
            kind: Secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    # Let external-dns IGNORE this route: the gateway-* source would otherwise publish
    # the host against NGF's own data-plane LB (internal). The record is published by the
    # `service` source from the nginx-gateway-lb Service below (the public NLB) instead.
    external-dns.alpha.kubernetes.io/controller: "none"
spec:
  parentRefs:
    - name: keycloak-gateway
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - backendRefs:
        # keycloakx's client-facing Service (chart fullnameOverride: keycloak).
        - name: keycloak-http
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway-lb
  namespace: keycloak
  annotations:
    # external-dns (service source) publishes this host as a CNAME to the NLB hostname
    # the AWS LB Controller writes into .status.loadBalancer — no hardcoded nlbTarget.
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.host | quote }}
    # Managed by the AWS Load Balancer Controller. The legacy "nlb" value uses the
    # in-tree provider, which ignores aws-load-balancer-scheme and defaulted to an
    # INTERNAL NLB on private subnets. "external" honors the scheme and places the
    # NLB on the kubernetes.io/role/elb public subnets.
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # Instance targets default to preserving the client IP, so the DATA packet reaches
    # the node with the real client source — not matched by the VPC-scoped NodePort
    # rule in modules/node-security-group, so the UI times out even though health
    # checks (from the NLB's in-VPC ENIs) pass. Off = NLB SNATs to its in-VPC address,
    # so the node SG rule matches real traffic too.
    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=false
spec:
  type: LoadBalancer
  selector:
    gateway.networking.k8s.io/gateway-name: keycloak-gateway
  ports:
    # NodePorts are pinned (values.nodePorts) so the infra node-SG rule can be a
    # tight range instead of the whole 30000-32767 span. Unset -> k8s auto-assigns.
    {{- $np := .Values.nodePorts | default dict }}
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
      {{- with $np.http }}
      nodePort: {{ . }}
      {{- end }}
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
      {{- with $np.https }}
      nodePort: {{ . }}
      {{- end }}
{{- end }}
