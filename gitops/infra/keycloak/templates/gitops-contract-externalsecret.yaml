{{- if .Values.gitopsContract.eso.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-contract
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.gitopsContract.eso.secretStore | default "aws-secrets-manager" }}
    kind: ClusterSecretStore
  target:
    name: keycloak-contract
    creationPolicy: Owner
  data:
    - secretKey: KC_DB_URL_HOST
      remoteRef:
        key: {{ required "gitopsContract.eso.secretName is required in eso mode" .Values.gitopsContract.eso.secretName }}
        property: keycloak_db_host
{{- end }}
