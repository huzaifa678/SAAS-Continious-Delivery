{{- if .Values.adminSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    # Ahead of the keycloak StatefulSet so the Secret it mounts exists first.
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.adminSecret.secretStore | default "aws-secrets-manager" }}
    kind: ClusterSecretStore
  target:
    name: keycloak-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.adminSecret.remoteName | default "keycloak-admin-secret" }}
        property: {{ .Values.adminSecret.remoteKey | default "password" }}
{{- end }}
