{{- if .Values.nodePool.enabled }}
{{- $cluster := .Values.karpenter.settings.clusterName }}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    metadata:
      labels:
        karpenter.sh/nodepool: default
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - { key: karpenter.k8s.aws/instance-family, operator: In, values: ["m5","m6i","m6a","c5","c6i","c6a","r5","r6i"] }
        - { key: karpenter.sh/capacity-type, operator: In, values: ["spot","on-demand"] }
        - { key: kubernetes.io/arch, operator: In, values: ["amd64"] }
        - { key: karpenter.k8s.aws/instance-size, operator: NotIn, values: ["nano","micro","small"] }
      expireAfter: Never
  limits: { cpu: "24", memory: 96Gi }
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    budgets:
      - nodes: "1"
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags: { karpenter.sh/discovery: {{ $cluster }} }
  securityGroupSelectorTerms:
    - tags: { karpenter.sh/discovery: {{ $cluster }} }
  instanceProfile: {{ .Values.nodePool.instanceProfile }}
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    # hop limit 2 so pods on the VPC CNI can reach IMDS (region/metadata lookups);
    # hop limit 1 drops the reply. IMDSv2 still enforced via httpTokens: required.
    httpPutResponseHopLimit: 2
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs: { volumeSize: 50Gi, volumeType: gp3, encrypted: true, deleteOnTermination: true }
  tags: { karpenter.sh/discovery: {{ $cluster }} }
{{- end }}
{{- if .Values.dataNodePool.enabled }}
---
# Dedicated pool for heavy stateful data/observability workloads (ELK). Tainted so
# only pods that tolerate `dedicated=data` land here; labelled `workload=data` for
# nodeSelector targeting. Reuses the `default` EC2NodeClass (same subnet/SG/profile
# discovery), so dataNodePool.enabled requires nodePool.enabled.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    metadata:
      labels:
        karpenter.sh/nodepool: data
        workload: data
    spec:
      taints:
        - key: dedicated
          value: data
          effect: NoSchedule
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        # Memory-optimised for ES/Logstash heap; general-purpose allowed too.
        - { key: karpenter.k8s.aws/instance-family, operator: In, values: ["r5","r6i","r6a","m5","m6i"] }
        # Capacity type per env (data defaults to on-demand so shard relocation
        # isn't cut short by a spot reclaim); prod can widen/narrow via values.
        - { key: karpenter.sh/capacity-type, operator: In, values: {{ toJson .Values.dataNodePool.capacityTypes }} }
        - { key: kubernetes.io/arch, operator: In, values: ["amd64"] }
        - { key: karpenter.k8s.aws/instance-size, operator: NotIn, values: ["nano","micro","small","medium"] }
      expireAfter: Never
  limits:
    cpu: {{ .Values.dataNodePool.limits.cpu | quote }}
    memory: {{ .Values.dataNodePool.limits.memory }}
  disruption:
    # Conservative: only reclaim genuinely empty data nodes, and not instantly.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
    budgets:
      - nodes: "1"
{{- end }}
{{- if .Values.batchNodePool.enabled }}
---
# Soft-isolation pool for bursty, ephemeral batch workloads (Airflow). Spot +
# scale-to-zero, labelled workload=batch and with NO taint: Airflow targets it via
# nodeSelector, but unselected pods can still land here and are never stranded.
# Reuses the `default` EC2NodeClass (so batchNodePool.enabled requires nodePool.enabled).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: batch
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    metadata:
      labels:
        karpenter.sh/nodepool: batch
        workload: batch
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - { key: karpenter.k8s.aws/instance-family, operator: In, values: ["m5","m6i","m6a","c5","c6i","c6a","r5","r6i"] }
        # Capacity type per env (batch defaults to spot-first — ephemeral tasks
        # tolerate interruptions; prod may pin on-demand for predictable ETL runs).
        - { key: karpenter.sh/capacity-type, operator: In, values: {{ toJson .Values.batchNodePool.capacityTypes }} }
        - { key: kubernetes.io/arch, operator: In, values: ["amd64"] }
        - { key: karpenter.k8s.aws/instance-size, operator: NotIn, values: ["nano","micro","small"] }
      # Recycle batch nodes weekly even if busy.
      expireAfter: 168h
  limits:
    cpu: {{ .Values.batchNodePool.limits.cpu | quote }}
    memory: {{ .Values.batchNodePool.limits.memory }}
  disruption:
    # Aggressive: drain back to zero quickly once DAG runs finish.
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    budgets:
      - nodes: "10%"
{{- end }}
