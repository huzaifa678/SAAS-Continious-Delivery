{{- if .Values.gitopsContract.eso.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karpenter-contract
  namespace: {{ .Release.Namespace }}
  annotations:
    # Ahead of the karpenter controller (subchart, implicit wave 0) so the Secret
    # its env references exists first.
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.gitopsContract.eso.secretStore | default "aws-secrets-manager" }}
    kind: ClusterSecretStore
  target:
    name: karpenter-contract
    creationPolicy: Owner
  data:
    - secretKey: CLUSTER_NAME
      remoteRef:
        key: {{ required "gitopsContract.eso.secretName is required in eso mode" .Values.gitopsContract.eso.secretName }}
        property: cluster_name
    - secretKey: INTERRUPTION_QUEUE
      remoteRef:
        key: {{ .Values.gitopsContract.eso.secretName }}
        property: karpenter_interruption_queue
{{- end }}
