image:
  repository: "533267178572.dkr.ecr.us-east-1.amazonaws.com/backstage-saas"
  tag: ""
  pullPolicy: IfNotPresent

replicas: 1

host: "backstage.freeeasycrypto.com"

issuer: letsencrypt

argocd:
  url: "https://argocd-server.argocd.svc.cluster.local"

secrets:
  dbSecret: saas-backstage-db-secret
  appSecret: backstage-app

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { cpu: 500m, memory: 512Mi }

# App-config overlay owned by this GitOps repo. A PreSync Job renders `overlay`
# into the `backstage-config-overlay` ConfigMap, which the Deployment mounts and
# loads as its LAST --config (so these values win over the image's baked
# app-config.yaml / app-config.production.yaml). Lets config change per-env
# without rebuilding the SAAS-IDP image. Set enabled:false to run on baked config
# only. Values may reference the pod's env (e.g. ${BACKSTAGE_HOST}) — Backstage
# substitutes them at config load, same as the baked files.
config:
  enabled: true
  # Must contain kubectl + a POSIX shell; overridable per-env.
  image: registry.k8s.io/kubectl:v1.31.1
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 1800
  # Free-form Backstage app-config, merged last. Example:
  #   overlay:
  #     organization:
  #       name: FreeEasyCrypto Platform
  #     app:
  #       title: SaaS Developer Portal
  overlay: {}

gateway:
  enabled: false

# Generate the Keycloak OIDC client secret and the Argo CD API token IN-CLUSTER
# (PreSync Jobs) instead of seeding them out-of-band into saas/backstage-input.
# When enabled, both land in the `targetSecret`, which the Deployment also loads
# via envFrom (it overrides any same-named keys coming from backstage-app). Opt-in:
# leave disabled to keep the seeded values. See docs/backstage-secret-generation.md.
secretGeneration:
  enabled: false
  # alpine/k8s carries kubectl + curl + jq, all the Jobs need.
  image: alpine/k8s:1.31.1
  targetSecret: backstage-generated
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 1800
  keycloak:
    namespace: keycloak
    url: http://keycloak.keycloak.svc.cluster.local
    realm: saas                       # must match the infra backstage module's keycloak_realm
    clientId: backstage               # must match keycloak_client_id
    adminSecret: keycloak-admin-secret
    # Backstage OIDC handler callback; derived from host when empty.
    redirectUri: ""
  argocd:
    namespace: argocd
    server: https://argocd-server.argocd.svc.cluster.local
    account: backstage                # must exist as an apiKey account in argocd-cm
    adminSecret: argocd-initial-admin-secret
