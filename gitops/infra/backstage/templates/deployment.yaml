{{- if not .Values.image.repository }}
{{- fail "backstage: image.repository is required (set it per-env; the image is built from the SAAS-IDP Dockerfile and pushed to ECR)." }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: {{ .Release.Namespace }}
  labels:
    app: backstage
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
      {{- if .Values.config.enabled }}
      annotations:
        # Roll the pods when the overlay changes (the config-render Job republishes
        # the ConfigMap at PreSync, but a ConfigMap change alone won't restart pods).
        checksum/config-overlay: {{ .Values.config.overlay | toYaml | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: backstage
      # Mounted token is what the Kubernetes plugin uses (localKubectlProxy).
      automountServiceAccountToken: true
      containers:
        - name: backstage
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Matches the SAAS-IDP Dockerfile CMD (base config + prod overlay).
          args:
            - "packages/backend"
            - "--config"
            - "app-config.yaml"
            - "--config"
            - "app-config.production.yaml"
            {{- if .Values.config.enabled }}
            - "--config"
            - "/app/config-overlay/app-config.overlay.yaml"
            {{- end }}
          ports:
            - name: http
              containerPort: 7007
          envFrom:
            # POSTGRES_* from the DB ExternalSecret; KEYCLOAK_*, GITHUB_TOKEN,
            # BACKEND_SECRET, ARGOCD_AUTH_TOKEN from the app ExternalSecret.
            - secretRef: { name: backstage-db }
            - secretRef: { name: backstage-app }
          env:
            - name: BACKSTAGE_HOST
              value: {{ .Values.host | quote }}
            - name: ARGOCD_URL
              value: {{ .Values.argocd.url | quote }}
            - name: NODE_ENV
              value: production
          readinessProbe:
            tcpSocket: { port: 7007 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 7007 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.config.enabled }}
          volumeMounts:
            - name: config-overlay
              mountPath: /app/config-overlay
              readOnly: true
      volumes:
        - name: config-overlay
          configMap:
            name: backstage-config-overlay
          {{- end }}
