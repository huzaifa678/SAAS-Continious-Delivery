{{- if .Values.secretGeneration.enabled }}
{{- $sg := .Values.secretGeneration }}
{{- $redirect := $sg.keycloak.redirectUri | default (printf "https://%s/api/auth/oidc/handler/frame" .Values.host) }}
# ─────────────────────────────────────────────────────────────────────────────
# In-cluster generation of the two secrets that otherwise have no generator and
# would have to be seeded by hand:
#   * Keycloak OIDC client secret  (KEYCLOAK_CLIENT_SECRET)
#   * Argo CD API token            (ARGOCD_AUTH_TOKEN)
# PreSync hooks run before the Deployment each sync; both are idempotent. The
# values are written to the {{ $sg.targetSecret }} Secret, which the Deployment
# loads via envFrom. Nothing here is ever printed or sent to AWS.
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-bootstrap
  namespace: {{ .Release.Namespace }}
  labels: { app: backstage }
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
---
# Write the generated Secret in the backstage namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-bootstrap
  namespace: {{ .Release.Namespace }}
  labels: { app: backstage }
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-bootstrap
  namespace: {{ .Release.Namespace }}
  labels: { app: backstage }
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: backstage-bootstrap }
subjects:
  - { kind: ServiceAccount, name: backstage-bootstrap, namespace: {{ .Release.Namespace }} }
---
# Read ONLY the Keycloak admin secret, cross-namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-bootstrap-kc
  namespace: {{ $sg.keycloak.namespace }}
  labels: { app: backstage }
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $sg.keycloak.adminSecret }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-bootstrap-kc
  namespace: {{ $sg.keycloak.namespace }}
  labels: { app: backstage }
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: backstage-bootstrap-kc }
subjects:
  - { kind: ServiceAccount, name: backstage-bootstrap, namespace: {{ .Release.Namespace }} }
---
# Read ONLY the Argo CD admin secret, cross-namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-bootstrap-argocd
  namespace: {{ $sg.argocd.namespace }}
  labels: { app: backstage }
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $sg.argocd.adminSecret }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-bootstrap-argocd
  namespace: {{ $sg.argocd.namespace }}
  labels: { app: backstage }
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: backstage-bootstrap-argocd }
subjects:
  - { kind: ServiceAccount, name: backstage-bootstrap, namespace: {{ .Release.Namespace }} }
---
# Wave -2: ensure the Keycloak client exists and publish its secret. Creates the
# target Secret (the Argo CD Job at wave -1 then merges its key in).
apiVersion: batch/v1
kind: Job
metadata:
  name: backstage-keycloak-client
  namespace: {{ .Release.Namespace }}
  labels: { app: backstage, job: keycloak-client }
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: {{ $sg.backoffLimit }}
  activeDeadlineSeconds: {{ $sg.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ $sg.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels: { app: backstage, job: keycloak-client }
      annotations: { sidecar.istio.io/inject: "false" }
    spec:
      restartPolicy: Never
      serviceAccountName: backstage-bootstrap
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: provision
          image: {{ $sg.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: KC_URL,        value: {{ $sg.keycloak.url | quote }} }
            - { name: KC_NS,         value: {{ $sg.keycloak.namespace | quote }} }
            - { name: KC_ADMIN_SECRET, value: {{ $sg.keycloak.adminSecret | quote }} }
            - { name: REALM,         value: {{ $sg.keycloak.realm | quote }} }
            - { name: CLIENT_ID,     value: {{ $sg.keycloak.clientId | quote }} }
            - { name: REDIRECT_URI,  value: {{ $redirect | quote }} }
            - { name: WEB_ORIGIN,    value: {{ printf "https://%s" .Values.host | quote }} }
            - { name: TARGET_SECRET, value: {{ $sg.targetSecret | quote }} }
            - { name: TARGET_NS,     value: {{ .Release.Namespace | quote }} }
            - { name: HOME,          value: /tmp }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ADMIN_PW="$(kubectl get secret "$KC_ADMIN_SECRET" -n "$KC_NS" -o jsonpath='{.data.password}' | base64 -d)"
              TOKEN="$(curl -fsS "$KC_URL/realms/master/protocol/openid-connect/token" \
                -d grant_type=password -d client_id=admin-cli -d username=admin \
                --data-urlencode "password=$ADMIN_PW" | jq -r .access_token)"
              [ -n "$TOKEN" ] && [ "$TOKEN" != null ] || { echo "keycloak admin auth failed"; exit 1; }
              auth="Authorization: Bearer $TOKEN"
              uuid="$(curl -fsS -H "$auth" "$KC_URL/admin/realms/$REALM/clients?clientId=$CLIENT_ID" | jq -r '.[0].id // empty')"
              if [ -z "$uuid" ]; then
                echo "creating client $CLIENT_ID in realm $REALM"
                curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
                  "$KC_URL/admin/realms/$REALM/clients" -d "$(jq -nc \
                    --arg c "$CLIENT_ID" --arg r "$REDIRECT_URI" --arg w "$WEB_ORIGIN" \
                    '{clientId:$c, protocol:"openid-connect", publicClient:false, standardFlowEnabled:true, redirectUris:[$r], webOrigins:[$w]}')"
                uuid="$(curl -fsS -H "$auth" "$KC_URL/admin/realms/$REALM/clients?clientId=$CLIENT_ID" | jq -r '.[0].id // empty')"
              fi
              [ -n "$uuid" ] || { echo "client lookup failed"; exit 1; }
              SECRET="$(curl -fsS -H "$auth" "$KC_URL/admin/realms/$REALM/clients/$uuid/client-secret" | jq -r '.value // empty')"
              if [ -z "$SECRET" ]; then
                SECRET="$(curl -fsS -X POST -H "$auth" "$KC_URL/admin/realms/$REALM/clients/$uuid/client-secret" | jq -r '.value')"
              fi
              [ -n "$SECRET" ] && [ "$SECRET" != null ] || { echo "no client secret"; exit 1; }
              kubectl patch secret "$TARGET_SECRET" -n "$TARGET_NS" --type merge \
                -p "$(jq -nc --arg v "$SECRET" '{stringData:{KEYCLOAK_CLIENT_SECRET:$v}}')" 2>/dev/null \
                || kubectl create secret generic "$TARGET_SECRET" -n "$TARGET_NS" --from-literal=KEYCLOAK_CLIENT_SECRET="$SECRET"
              echo "published KEYCLOAK_CLIENT_SECRET"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
# Wave -1: mint an Argo CD API token for the backstage account and merge it in.
apiVersion: batch/v1
kind: Job
metadata:
  name: backstage-argocd-token
  namespace: {{ .Release.Namespace }}
  labels: { app: backstage, job: argocd-token }
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: {{ $sg.backoffLimit }}
  activeDeadlineSeconds: {{ $sg.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ $sg.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels: { app: backstage, job: argocd-token }
      annotations: { sidecar.istio.io/inject: "false" }
    spec:
      restartPolicy: Never
      serviceAccountName: backstage-bootstrap
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: provision
          image: {{ $sg.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: ARGO_SERVER,   value: {{ $sg.argocd.server | quote }} }
            - { name: ARGO_NS,       value: {{ $sg.argocd.namespace | quote }} }
            - { name: ARGO_ADMIN_SECRET, value: {{ $sg.argocd.adminSecret | quote }} }
            - { name: ARGO_ACCOUNT,  value: {{ $sg.argocd.account | quote }} }
            - { name: TARGET_SECRET, value: {{ $sg.targetSecret | quote }} }
            - { name: TARGET_NS,     value: {{ .Release.Namespace | quote }} }
            - { name: HOME,          value: /tmp }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ADMIN_PW="$(kubectl get secret "$ARGO_ADMIN_SECRET" -n "$ARGO_NS" -o jsonpath='{.data.password}' | base64 -d)"
              SESS="$(curl -fsSk "$ARGO_SERVER/api/v1/session" \
                -d "$(jq -nc --arg p "$ADMIN_PW" '{username:"admin", password:$p}')" | jq -r .token)"
              [ -n "$SESS" ] && [ "$SESS" != null ] || { echo "argocd admin login failed"; exit 1; }
              TOKEN="$(curl -fsSk -X POST -H "Authorization: Bearer $SESS" \
                "$ARGO_SERVER/api/v1/account/$ARGO_ACCOUNT/token" | jq -r '.token // empty')"
              [ -n "$TOKEN" ] || { echo "token mint failed (is '$ARGO_ACCOUNT' an apiKey account in argocd-cm?)"; exit 1; }
              kubectl patch secret "$TARGET_SECRET" -n "$TARGET_NS" --type merge \
                -p "$(jq -nc --arg v "$TOKEN" '{stringData:{ARGOCD_AUTH_TOKEN:$v}}')" 2>/dev/null \
                || kubectl create secret generic "$TARGET_SECRET" -n "$TARGET_NS" --from-literal=ARGOCD_AUTH_TOKEN="$TOKEN"
              echo "published ARGOCD_AUTH_TOKEN"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
{{- end }}
