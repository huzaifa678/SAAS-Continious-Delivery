---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-db
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: backstage-db
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        POSTGRES_HOST: '{{ `{{ (splitList ":" .endpoint) | first }}` }}'
        POSTGRES_PORT: '{{ `{{ (splitList ":" .endpoint) | last }}` }}'
        POSTGRES_USER: '{{ `{{ .username }}` }}'
        POSTGRES_PASSWORD: '{{ `{{ .password }}` }}'
        POSTGRES_DB: '{{ `{{ .db_name }}` }}'
  data:
    - { secretKey: username, remoteRef: { key: {{ .Values.secrets.dbSecret }}, property: username } }
    - { secretKey: password, remoteRef: { key: {{ .Values.secrets.dbSecret }}, property: password } }
    - { secretKey: endpoint, remoteRef: { key: {{ .Values.secrets.dbSecret }}, property: endpoint } }
    - { secretKey: db_name,  remoteRef: { key: {{ .Values.secrets.dbSecret }}, property: db_name  } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-app
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: backstage-app
    creationPolicy: Owner
  # Pull every key of the JSON secret through as-is, so the pod's envFrom sees
  # KEYCLOAK_*, GITHUB_TOKEN, BACKEND_SECRET and ARGOCD_AUTH_TOKEN directly.
  dataFrom:
    - extract:
        key: {{ .Values.secrets.appSecret }}
