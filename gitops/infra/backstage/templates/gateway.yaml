{{- if .Values.gateway.enabled }}
---
# TLS cert for the portal host, issued by the SHARED cert-manager ClusterIssuer
# (gitops/infra/cert-manager), the same one argocd/grafana use — set via
# .Values.issuer. No bespoke per-app ClusterIssuer.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: backstage-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: backstage-tls
  issuerRef:
    name: {{ .Values.issuer }}
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.host | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: backstage-gateway
  namespace: {{ .Release.Namespace }}
spec:
  # NGF applies these to the LoadBalancer Service it provisions for this Gateway, so the
  # NLB is internet-facing on the public (role/elb) subnets and its hostname lands in the
  # Gateway's status.addresses — which external-dns (gateway-httproute source) publishes.
  # Without this, NGF's default LB came up internal and external-dns published a private IP.
  infrastructure:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "external"
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
  gatewayClassName: nginx
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: {{ .Values.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: backstage-tls
            kind: Secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backstage
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: backstage-gateway
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - backendRefs:
        - name: backstage
          port: 7007
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway-lb
  namespace: {{ .Release.Namespace }}
  annotations:
    # Managed by the AWS Load Balancer Controller. The legacy "nlb" value uses the
    # in-tree provider, which ignores aws-load-balancer-scheme and defaulted to an
    # INTERNAL NLB on private subnets. "external" honors the scheme and places the
    # NLB on the kubernetes.io/role/elb public subnets.
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    gateway.networking.k8s.io/gateway-name: backstage-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
{{- end }}
