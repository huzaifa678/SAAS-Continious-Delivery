{{- if .Values.gateway.enabled }}
---
# TLS cert for the portal host, issued by the SHARED cert-manager ClusterIssuer
# (gitops/infra/cert-manager), the same one argocd/grafana use — set via
# .Values.issuer. No bespoke per-app ClusterIssuer.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: backstage-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: backstage-tls
  issuerRef:
    name: {{ .Values.issuer }}
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.host | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: backstage-gateway
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: nginx
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: {{ .Values.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: backstage-tls
            kind: Secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backstage
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: backstage-gateway
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - backendRefs:
        - name: backstage
          port: 7007
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway-lb
  namespace: {{ .Release.Namespace }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    gateway.networking.k8s.io/gateway-name: backstage-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
{{- end }}
