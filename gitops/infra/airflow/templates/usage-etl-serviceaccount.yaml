{{- if .Values.usageEtl.serviceAccount.create }}
# ServiceAccount the usage-ETL task pods (KubernetesPodOperator) run as. EKS Pod
# Identity binds it to the MSK SASL/IAM role in Terraform
# (layers/20-data: module.msk_client_identity["usage-etl-airflow"], namespace airflow,
# service_account usage-etl) — so Pod Identity needs NO annotation here; the association
# is by (namespace, serviceAccountName). The Kafka consumer stage authenticates to MSK
# with SASL/IAM through this SA; no static credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.usageEtl.serviceAccount.name }}
  namespace: airflow
  labels:
    app: usage-etl
  annotations:
    argocd.argoproj.io/sync-wave: "1"
{{- end }}
