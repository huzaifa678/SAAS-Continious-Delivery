{{- if .Values.usageEtl.externalSecret.enabled }}
# Syncs the usage-ETL task-pod config/secrets from AWS Secrets Manager into the
# `usage-etl-env` Secret in the airflow namespace (consumed by the KubernetesPodOperator
# pods via env_from -> USAGE_ETL_ENV_SECRET). Same ESO pattern as the service charts.
# The remote key should hold the ETL env, e.g.: DATABASE_URL, OPENAI_API_KEY,
# KAFKA_BOOTSTRAP_SERVERS, KAFKA_TOPIC, KAFKA_GROUP_ID, PGVECTOR_COLLECTION, etc.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.usageEtl.externalSecret.target.name }}
  namespace: airflow
  labels:
    app: usage-etl
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ .Values.usageEtl.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.usageEtl.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.usageEtl.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.usageEtl.externalSecret.target.name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.usageEtl.externalSecret.remoteRef.key }}
{{- end }}
