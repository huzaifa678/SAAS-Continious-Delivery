{{- if .Values.appDatabase.enabled }}
apiVersion: platform.saas.example/v1alpha1
kind: AppDatabase
metadata:
  name: airflow
  namespace: airflow
  labels:
    app: airflow
  annotations:
    # Must be provisioned BEFORE the airflow workload: the scheduler/webserver pods
    # mount the airflow-db connection secret this claim writes. At a later wave the
    # workload (wave 0) never goes Healthy, so Argo never advances to apply the claim
    # — a deadlock that leaves airflow-db missing. A negative wave creates the DB first.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  parameters:
    databaseName: airflow
    owner: airflow
    instance: airflow
  writeConnectionSecretToRef:
    name: airflow-db
{{- end }}
