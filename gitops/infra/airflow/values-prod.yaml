# Per-env override. `env` is a LIST (Helm replaces, not merges), so the full list is
# repeated here with the prod ETL image tag. The DB connection is injected via `secret:`
# in values.yaml. gitSync is a map, so only branch is overridden. nodeSelector
# soft-isolates Airflow onto the `batch` Karpenter pool (scheduler, api-server,
# dag-processor, triggerer, migrate job, and the KubernetesExecutor task pods).
airflow:
  env:
    - name: USAGE_ETL_IMAGE_REPO
      value: "533267178572.dkr.ecr.us-east-1.amazonaws.com/usage-service"
    - name: USAGE_ETL_IMAGE_TAG
      value: "prod"
    - name: USAGE_ETL_NAMESPACE
      value: "airflow"
    - name: USAGE_ETL_ENV_SECRET
      value: "usage-etl-env"
    - name: USAGE_ETL_SERVICE_ACCOUNT
      value: "usage-etl"
  images:
    airflow:
      tag: "airflow-prod"
  nodeSelector:
    workload: batch
  dags:
    gitSync:
      branch: "main"
