---
# Values for the OFFICIAL Apache Airflow Helm chart (dependency alias: `airflow`).
# Migrated from the community airflow-helm 8.9.0 chart (Airflow 2.x — EOL 2026-04-22)
# to the official chart (Airflow 3.x). The official chart's keys sit directly under the
# `airflow:` alias.
airflow:
  executor: KubernetesExecutor

  # Keep in sync with the custom image's Airflow version (see images.airflow below). The
  # chart defaults this to its appVersion (3.2.2); the official upgrade guide says to set
  # it to the running 3.x release. All chart version-gates are major-only (Airflow 2 vs 3),
  # so 3.2.2 vs 3.3.2 render identically — this is correctness/future-proofing, not a fix.
  airflowVersion: "3.3.2"

  # Fallback image tag for containers the chart renders from the DEFAULT image rather than
  # images.airflow — notably the KubernetesExecutor worker pod-template ConfigMap. The
  # chart default is the appVersion (3.2.2); left unset, task/worker pods would run the
  # UNPATCHED, version-skewed apache/airflow:3.2.2 while the scheduler/api-server run the
  # custom 3.3.2 image. Pin it to the patched release so no 3.2.2 remains and every Airflow
  # process is on 3.3.2. (worker_container_repository/tag still point workers at the custom
  # image via airflow.cfg; this closes the pod-template path regardless of executor precedence.)
  defaultAirflowTag: "3.3.2"

  # Custom orchestrator image (usage-service/airflow/Dockerfile): apache/airflow 3.3.2
  # (patched for CVE-2026-33264 et al.), slimmed to the cncf.kubernetes + standard
  # providers + security patches. This chart (official 1.22.0) defaults to appVersion
  # 3.2.2, but we override the image here, so its Airflow-3.x templates run the patched
  # 3.3.2 binary. Built by CI as usage-service:airflow-<tag>; the tag is set per-env in
  # values-<env>.yaml (CD rewrites it on promote).
  images:
    airflow:
      repository: "533267178572.dkr.ecr.us-east-1.amazonaws.com/usage-service"
      tag: "airflow-dev"

  # No bundled datastores: Postgres is the Crossplane AppDatabase (RDS), and
  # KubernetesExecutor needs no Redis/Celery.
  postgresql:
    enabled: false
  redis:
    enabled: false

  enableBuiltInSecretEnvVars:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: false
  secret:
    - envName: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
      secretName: airflow-db
      secretKey: dsn

  env:
    - name: USAGE_ETL_IMAGE_REPO
      value: "533267178572.dkr.ecr.us-east-1.amazonaws.com/usage-service"
    - name: USAGE_ETL_IMAGE_TAG
      value: "dev"
    - name: USAGE_ETL_NAMESPACE
      value: "airflow"
    - name: USAGE_ETL_ENV_SECRET
      value: "usage-etl-env"
    - name: USAGE_ETL_SERVICE_ACCOUNT
      value: "usage-etl"

  # DAGs come from the usage-service repo via git-sync (versioned with the ETL code).
  dags:
    gitSync:
      enabled: true
      repo: "https://github.com/huzaifa678/usage-service.git"
      branch: "dev"            # overridden per-env in values-<env>.yaml
      rev: HEAD
      subPath: "usage-service/airflow/dags"
      period: 60s

  # Airflow 3 runs scheduler + api-server + dag-processor + triggerer. The migrate job
  # runs `airflow db migrate` on deploy (handles the 2.x -> 3.x schema upgrade).
  migrateDatabaseJob:
    enabled: true

# Crossplane AppDatabase claim for airflow's metadata DB (templates/appdatabase.yaml).
appDatabase:
  enabled: true

# ServiceAccount for the usage-ETL task pods (templates/usage-etl-serviceaccount.yaml),
# bound to MSK IAM via Pod Identity in Terraform. Name must match kafka_clients and
# USAGE_ETL_SERVICE_ACCOUNT above.
usageEtl:
  serviceAccount:
    create: true
    name: usage-etl
  # usage-etl-env Secret, synced from AWS Secrets Manager via ESO
  # (templates/usage-etl-externalsecret.yaml). Name matches USAGE_ETL_ENV_SECRET.
  externalSecret:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      name: aws-secrets-manager
      kind: ClusterSecretStore
    remoteRef:
      key: saas/usage-etl
    target:
      name: usage-etl-env
