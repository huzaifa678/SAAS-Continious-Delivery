# Per-env override. `env` is a LIST (Helm replaces, not merges), so the full list is
# repeated here with this env's ETL image tag (CD rewrites USAGE_ETL_IMAGE_TAG on
# promote). The DB connection is injected via `secret:` in values.yaml. gitSync is a
# map, so only branch is overridden. nodeSelector soft-isolates Airflow onto the `batch`
# Karpenter pool (applies to scheduler, api-server, dag-processor, triggerer, the migrate
# job and the KubernetesExecutor task pods).
airflow:
  env:
    - name: USAGE_ETL_IMAGE_REPO
      value: "533267178572.dkr.ecr.us-east-1.amazonaws.com/usage-service"
    - name: USAGE_ETL_IMAGE_TAG
      value: "sha-53503efe2534b209d604259017db0990842db39c"
    - name: USAGE_ETL_NAMESPACE
      value: "airflow"
    - name: USAGE_ETL_ENV_SECRET
      value: "usage-etl-env"
    - name: USAGE_ETL_SERVICE_ACCOUNT
      value: "usage-etl"
  images:
    airflow:
      tag: "airflow-sha-53503efe2534b209d604259017db0990842db39c"
  nodeSelector:
    workload: batch
  dags:
    gitSync:
      branch: "main"
