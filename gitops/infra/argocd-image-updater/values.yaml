argocd-image-updater:
  # Chart 1.x restructured these keys: logLevel -> config.log.level, and the
  # top-level gitCommitUser/gitCommitMail -> config.git.user/config.git.email.
  config:
    log.level: info
    git.user: argocd-image-updater
    git.email: image-updater@saas.local
    registries:
      - name: ECR
        prefix: 123456789.dkr.ecr.us-east-1.amazonaws.com
        api_url: https://123456789.dkr.ecr.us-east-1.amazonaws.com
        ping: true
        credentials: ext:/scripts/ecr-login.sh
        credsexpire: 10h
  authScripts:
    enabled: true
    scripts:
      ecr-login.sh: |
        #!/bin/sh
        aws ecr --region us-east-1 get-authorization-token \
          --output text --query 'authorizationData[].authorizationToken' \
          | base64 -d
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/argocd-image-updater
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 128Mi }
