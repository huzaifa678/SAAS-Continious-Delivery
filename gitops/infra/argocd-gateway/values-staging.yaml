host: argocd.staging.freeeasycrypto.com

# Pinned NodePorts for the internet-facing nginx-gateway-lb Service, so the infra
# node-SG rule (modules/node-security-group: gateway_nodeport_min/max) stays a tight
# range. Block 30100-30107 = argocd/keycloak/backstage/grafana x {http,https}.
nodePorts:
  http: 30100
  https: 30101
