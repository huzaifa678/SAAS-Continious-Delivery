# Git-files generator config for the flattened addons ApplicationSet.
# Per-env membership file (one per env, see appsets/addons.yaml). This addon
# runs in all envs; split into app.<env>.yaml so app-level settings (namespace,
# syncWave, or membership) can diverge per env without touching the others.
# Syncs after cert-manager + nginx-gateway (issuer + gatewayclass).
namespace: argocd
syncWave: "2"
