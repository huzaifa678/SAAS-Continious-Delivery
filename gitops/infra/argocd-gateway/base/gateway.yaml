---
# Secure external access to the ArgoCD UI/API through nginx-gateway-fabric,
# with a cert-manager-issued TLS cert. Mirrors the keycloak gateway pattern.
#
# TLS is TERMINATED at the Gateway (the cert-manager `letsencrypt` ClusterIssuer
# from the cert-manager addon issues `argocd-tls`), then forwarded as HTTP to
# argocd-server:80. That requires argocd-server to run in insecure mode
# (`configs.params.server.insecure: true` in the Terraform argocd-values.yaml),
# otherwise it 307-redirects :80 → :443 and the route loops.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-tls
  namespace: argocd
spec:
  secretName: argocd-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - REPLACED_BY_OVERLAY
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argocd-gateway
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: nginx
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: REPLACED_BY_OVERLAY
      tls:
        mode: Terminate
        certificateRefs:
          - name: argocd-tls
            kind: Secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: argocd-gateway
  hostnames:
    - REPLACED_BY_OVERLAY
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway-lb
  namespace: argocd
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    gateway.networking.k8s.io/gateway-name: argocd-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
