---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Per-env hostname for the ArgoCD UI (Certificate SAN, Gateway listener, HTTPRoute).
patches:
  - target: { group: cert-manager.io, version: v1, kind: Certificate, name: argocd-tls }
    patch: |-
      - op: replace
        path: /spec/dnsNames/0
        value: argocd.saas.internal
  - target: { group: gateway.networking.k8s.io, version: v1, kind: Gateway, name: argocd-gateway }
    patch: |-
      - op: replace
        path: /spec/listeners/0/hostname
        value: argocd.saas.internal
  - target: { group: gateway.networking.k8s.io, version: v1, kind: HTTPRoute, name: argocd }
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: argocd.saas.internal
