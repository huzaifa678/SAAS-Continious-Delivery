# Secure external access to the Grafana UI (kube-prometheus-stack) through
# nginx-gateway-fabric with a cert-manager-issued TLS cert. TLS terminates at
# the Gateway; Grafana serves plain HTTP.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: monitoring
spec:
  secretName: grafana-tls
  issuerRef:
    name: {{ .Values.issuer }}
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.host | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: grafana-gateway
  namespace: monitoring
  {{- with .Values.nlbTarget }}
  annotations:
    # external-dns publishes this record to the internet-facing nginx-gateway-lb NLB.
    # NGF's own data-plane LB is internal and can't be annotated in this NGF version, so
    # DNS points at the manual NLB — the same external-dns target pattern as saas-gateway.
    external-dns.alpha.kubernetes.io/target: {{ . | quote }}
  {{- end }}
spec:
  gatewayClassName: nginx
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: {{ .Values.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: grafana-tls
            kind: Secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: grafana-gateway
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - backendRefs:
        - name: {{ .Values.backendService }}
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway-lb
  namespace: monitoring
  annotations:
    # Managed by the AWS Load Balancer Controller. The legacy "nlb" value uses the
    # in-tree provider, which ignores aws-load-balancer-scheme and defaulted to an
    # INTERNAL NLB on private subnets. "external" honors the scheme and places the
    # NLB on the kubernetes.io/role/elb public subnets.
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    gateway.networking.k8s.io/gateway-name: grafana-gateway
  ports:
    - { name: http,  port: 80,  targetPort: 80,  protocol: TCP }
    - { name: https, port: 443, targetPort: 443, protocol: TCP }
