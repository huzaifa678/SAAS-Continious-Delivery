apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app: otel-collector
data:
  config.yaml: |
    extensions:
      sigv4auth:
        region: {{ .Values.region }}
        service: aps
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
      resource:
        attributes:
          - key: service.name
            from_attribute: service.name
            action: insert
    exporters:
      awsxray:
        region: {{ .Values.region }}
      prometheusremotewrite:
        endpoint: {{ .Values.prometheusEndpoint }}api/v1/remote_write
        auth:
          authenticator: sigv4auth
      awscloudwatchlogs:
        region: {{ .Values.region }}
        log_group_name: /saas/otel/logs
        log_stream_name: otel-stream
    service:
      extensions: [sigv4auth]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [awsxray]
        metrics:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [awscloudwatchlogs]
