apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app: otel-collector
data:
  config.yaml: |
    extensions:
      sigv4auth:
        region: {{ .Values.region }}
        service: aps
      # A second sigv4auth instance for the OpenSearch domain (service: es). The
      # key must be <type>/<name> = sigv4auth/os; a bare `sigv4_os` is parsed as
      # an unknown extension *type* and fails config load.
      sigv4auth/os:
        region: {{ .Values.region }}
        service: es
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
      resource:
        attributes:
          - key: service.name
            from_attribute: service.name
            action: insert
          - key: cloud.provider
            value: aws
            action: insert
      transform/logs:
        log_statements:
          - context: log
            statements:
              - set(attributes["message"], body)
              - set(attributes["log.level"], severity_text)
              - set(attributes["service.name"], resource.attributes["service.name"])
    exporters:
      awsxray:
        region: {{ .Values.region }}
      prometheusremotewrite:
        endpoint: {{ .Values.prometheusEndpoint }}api/v1/remote_write
        auth:
          authenticator: sigv4auth
      opensearch:
        # contrib opensearch exporter: endpoint + auth live under `http` (it embeds
        # confighttp.ClientConfig); sigv4auth signs the request to the AWS domain.
        http:
          endpoint: https://{{ .Values.opensearchEndpoint }}
          auth:
            authenticator: sigv4auth/os
        # ss4o mapping (the default mode) requires dataset + namespace.
        dataset: otel
        namespace: default
        # Daily indices. `%{...}` resolves attributes, NOT dates — the date suffix
        # comes from *_index_time_format and is joined with a '-', so
        # logs_index "otel-logs" + "yyyy.MM.dd" => otel-logs-2026.10.21.
        logs_index: otel-logs
        logs_index_time_format: "yyyy.MM.dd"
        traces_index: otel-traces
        traces_index_time_format: "yyyy.MM.dd"
    service:
      extensions: [sigv4auth, sigv4auth/os]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [awsxray, opensearch]
        metrics:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [transform/logs, batch]
          exporters: [opensearch]
