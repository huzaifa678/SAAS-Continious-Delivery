apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app: otel-collector
data:
  config.yaml: |
    extensions:
      sigv4auth:
        region: {{ .Values.region }}
        service: aps
      sigv4_os:
        region: {{ .Values.region }}
        service: es
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
      resource:
        attributes:
          - key: service.name
            from_attribute: service.name
            action: insert
          - key: cloud.provider
            value: aws
            action: insert
      transform/logs:
        log_statements:
          - context: log
            statements:
              - set(attributes["message"], body)
              - set(attributes["log.level"], severity_text)
              - set(attributes["service.name"], resource.attributes["service.name"])
    exporters:
      awsxray:
        region: {{ .Values.region }}
      prometheusremotewrite:
        endpoint: {{ .Values.prometheusEndpoint }}api/v1/remote_write
        auth:
          authenticator: sigv4auth
      opensearch:
        endpoint: https://{{ .Values.opensearchEndpoint }}
        auth:
          authenticator: sigv4_os
        logs_index: otel-logs-%{+yyyy.MM.dd}
        traces_index: otel-traces-%{+yyyy.MM.dd}
    service:
      extensions: [sigv4auth, sigv4_os]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [awsxray, opensearch]
        metrics:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [transform/logs, batch]
          exporters: [opensearch]
