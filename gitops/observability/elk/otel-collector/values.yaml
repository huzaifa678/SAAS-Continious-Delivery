# region + prometheusEndpoint + opensearchEndpoint are supplied per-env by
# values-<env>.generated.yaml, rendered from the observability gitops_contract
# (40-observability). Placeholders below keep `helm template` working without it.
region: us-east-1
prometheusEndpoint: ""
opensearchEndpoint: ""

# The config below uses the `transform` processor and `opensearch` exporter,
# which ship only in the upstream contrib distro — the ADOT collector
# (aws-otel-collector) rejects them with "unknown type". Pin the contrib image
# (same distro/tag the saas-chart already uses).
image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.159.0"

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi
