name: validate-composition

on:
  pull_request:
    paths:
      - 'scripts/gen/appdatabase-composition/**'
      - 'platform/compositions/appdatabase-postgres.yaml'
      - '.github/workflows/validate-composition.yml'
  push:
    branches: [main]

jobs:
  composition-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: scripts/gen/appdatabase-composition/go.sum

      - name: Check the Composition is in sync with its generator
        run: make check-composition
