name: build-function

# Builds and packages the custom Crossplane composition functions as docker
# images and pushes them to their ECR repositories. The images are then
# referenced in platform/functions/functions.yaml. Both functions build from the
# same commit and share its git-sha tag.

on:
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/build-function.yml'
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/build-function.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  CROSSPLANE_VERSION: v1.18.0

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The ECR repo name matches the function directory name.
        function: [function-appdatabase, function-appcache]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=sha-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: functions/${{ matrix.function }}
          push: true
          # go vet + go test run inside the Dockerfile build.
          tags: ${{ steps.ecr.outputs.registry }}/${{ matrix.function }}:runtime-${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.function }}
          cache-to: type=gha,mode=max,scope=${{ matrix.function }}

  package:
    runs-on: ubuntu-latest
    needs: [build-runtime]
    strategy:
      fail-fast: false
      matrix:
        function: [function-appdatabase, function-appcache]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install crossplane CLI
        run: |
          curl -sL "https://releases.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crank" -o /usr/local/bin/crossplane
          chmod +x /usr/local/bin/crossplane
          crossplane version --client

      - name: Build and push the Function package
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          FUNCTION: ${{ matrix.function }}
          TAG: ${{ needs.build-runtime.outputs.tag }}
        run: |
          set -euo pipefail
          RUNTIME_REF="${REGISTRY}/${FUNCTION}:runtime-${TAG}"
          PACKAGE_REF="${REGISTRY}/${FUNCTION}:${TAG}"
          cd functions/${FUNCTION}
          # `crossplane xpkg build --embed-runtime-image` resolves the runtime image
          # from the LOCAL Docker daemon, not the registry. build-runtime pushed it
          # straight to ECR (buildx, no local load) on a different runner, so pull it
          # into this runner's daemon first (ecr-login already authenticated it).
          docker pull "${RUNTIME_REF}"
          crossplane xpkg build \
            --package-root=package \
            --embed-runtime-image="${RUNTIME_REF}" \
            --package-file=function.xpkg
          crossplane xpkg push -f function.xpkg "${PACKAGE_REF}"
          echo "pushed ${PACKAGE_REF}"

  trivy:
    runs-on: ubuntu-latest
    needs: [build-runtime]
    strategy:
      fail-fast: false
      matrix:
        function: [function-appdatabase, function-appcache]
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Trivy image scan (scan-before-push gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ecr.outputs.url }}:sha-${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # main only: pin platform/functions/functions.yaml to the tag just pushed. The
  # renderer stamps that one tag onto BOTH function images. The ECR registry host
  # comes from ecr-login (the authenticated account) — the same host the contract
  # publishes — so the account is never hardcoded.
  bump-tag:
    runs-on: ubuntu-latest
    needs: [build-runtime, package]
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Render functions.yaml with the pushed tag and commit
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ needs.build-runtime.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/render_gitops.py \
            --functions-out platform/functions/functions.yaml \
            --registry "$REGISTRY" --function-tag "$TAG"
          if git diff --quiet platform/functions/functions.yaml; then
            echo "functions.yaml already at ${TAG}"; exit 0
          fi
          git config user.name "function-builder[bot]"
          git config user.email "function-builder@users.noreply.github.com"
          git add platform/functions/functions.yaml
          git commit -m "pin function images to ${TAG}"
          git push
