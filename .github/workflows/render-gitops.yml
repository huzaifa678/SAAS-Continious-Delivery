name: render-gitops

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, test, prod]

permissions:
  id-token: write
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch GitOps contract from SSM
        run: |
          mkdir -p contracts
          aws ssm get-parameter \
            --name "/saas/${{ inputs.environment }}/gitops-contract" \
            --with-decryption --query Parameter.Value --output text \
            > "contracts/gitops-contract.${{ inputs.environment }}.json"

      - name: Render manifests
        env:
          ENV: ${{ inputs.environment }}
        run: |
          contract="contracts/gitops-contract.${ENV}.json"
          # provider-sql (crossplane) — unchanged.
          python3 scripts/render_gitops.py --contract "$contract" \
            --out "infra/overlays/${ENV}/crossplane/provider-sql.yaml"
          # karpenter clusterName + interruption queue, from the contract cluster block.
          python3 scripts/render_gitops.py --contract "$contract" \
            --karpenter-out "gitops/infra/karpenter/values-${ENV}.generated.yaml"
          # keycloak external DB host — prod only (dev/staging use in-cluster Postgres).
          if [ "$ENV" = "prod" ]; then
            python3 scripts/render_gitops.py --contract "$contract" \
              --keycloak-out "gitops/infra/keycloak/values-prod.generated.yaml"
          fi
          # crossplane functions install — ECR registry host from the contract.
          # Preserve the current image tag (owned by the build-function workflow).
          fn_tag=$(grep -oE 'function-appdatabase:[^ ]+' platform/functions/functions.yaml | head -1 | cut -d: -f2)
          python3 scripts/render_gitops.py --contract "$contract" \
            --functions-out platform/functions/functions.yaml \
            --function-tag "${fn_tag:-latest}"

      - name: Commit rendered manifests
        env:
          ENV: ${{ inputs.environment }}
        run: |
          git config user.name "gitops-renderer[bot]"
          git config user.email "gitops-renderer@users.noreply.github.com"
          git add "contracts/gitops-contract.${ENV}.json" \
            "infra/overlays/${ENV}/crossplane/provider-sql.yaml" \
            "gitops/infra/karpenter/values-${ENV}.generated.yaml" \
            "platform/functions/functions.yaml"
          [ "$ENV" = "prod" ] && git add "gitops/infra/keycloak/values-prod.generated.yaml" || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "render provider-sql for ${{ inputs.environment }} from gitops contract"
            git push
          fi
