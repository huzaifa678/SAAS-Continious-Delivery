name: render-gitops

on:
  workflow_dispatch:
    inputs:
      environment:
        # The INFRA environment that published the contract to SSM. The infra repo
        # calls the staging tier "test"; the contract carries the CD-facing name
        # (test -> staging), which this workflow uses for all output paths.
        description: "Infra environment that published the contract (staging tier = 'test')"
        required: true
        default: "dev"
        type: choice
        options: [dev, test, prod]

permissions:
  id-token: write
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate delivery-mode guard rail
        run: python3 scripts/check-delivery-mode.py

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch GitOps contract from SSM
        env:
          INFRA_ENV: ${{ inputs.environment }}
        run: |
          mkdir -p contracts
          # Contract is published under the INFRA env name (e.g. /saas/test/...).
          aws ssm get-parameter \
            --name "/saas/${INFRA_ENV}/gitops-contract" \
            --with-decryption --query Parameter.Value --output text \
            > contracts/.contract.src.json
          # CD-facing env name comes FROM the contract (infra "test" -> "staging").
          CD_ENV="$(jq -r '.environment // empty' contracts/.contract.src.json)"
          CD_ENV="${CD_ENV:-$INFRA_ENV}"
          mv contracts/.contract.src.json "contracts/gitops-contract.${CD_ENV}.json"
          echo "CD_ENV=${CD_ENV}" >> "$GITHUB_ENV"
          echo "gitops contract: infra env '${INFRA_ENV}' -> CD env '${CD_ENV}'"
          # Observability contract (AMP/OpenSearch endpoints) is published separately
          # by 40-observability — a later layer than the main contract. Optional:
          # absent until that layer has applied, in which case otel render is skipped.
          if aws ssm get-parameter \
               --name "/saas/${INFRA_ENV}/gitops-contract-observability" \
               --with-decryption --query Parameter.Value --output text \
               > "contracts/gitops-contract-observability.${CD_ENV}.json" 2>/dev/null; then
            echo "observability contract fetched."
          else
            rm -f "contracts/gitops-contract-observability.${CD_ENV}.json"
            echo "no observability contract yet (otel-collector render will be skipped)."
          fi

      - name: Read delivery mode
        id: mode
        run: |
          mode_file="contracts/delivery-mode.${CD_ENV}"
          if [ ! -f "$mode_file" ]; then
            echo "::error::$mode_file not found"; exit 1
          fi
          mode="$(tr -d '[:space:]' < "$mode_file")"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "delivery mode for ${CD_ENV} is '${mode}'."

      - name: Render manifests
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          contract="contracts/gitops-contract.${CD_ENV}.json"
          # provider-sql (crossplane) — rendered in BOTH modes.
          python3 scripts/render_gitops.py --contract "$contract" \
            --out "infra/overlays/${CD_ENV}/crossplane/provider-sql.yaml"
          # crossplane functions install — ECR registry host from the contract.
          # Preserve the current image tag (owned by the build-function workflow).
          fn_tag=$(grep -oE 'function-appdatabase:[^ ]+' platform/functions/functions.yaml | head -1 | cut -d: -f2)
          python3 scripts/render_gitops.py --contract "$contract" \
            --functions-out platform/functions/functions.yaml \
            --function-tag "${fn_tag:-latest}"
          # cilium k8sServiceHost and the OTel/velero endpoints are contract-derived
          # rendered in both modes
          python3 scripts/render_gitops.py --contract "$contract" \
            --cilium-out "gitops/infra/cilium/values-${CD_ENV}.generated.yaml"
          # OTel collector endpoints ,only when the observability contract is
          # present. Its `stack` (grafana|elk) selects which collector chart the
          # generated values land in; the other stack has no app on this cluster.
          obs="contracts/gitops-contract-observability.${CD_ENV}.json"
          if [ -f "$obs" ]; then
            stack="$(jq -r '.observability.stack // empty' "$obs")"
            if [ -n "$stack" ]; then
              python3 scripts/render_gitops.py --obs-contract "$obs" \
                --otel-out "gitops/observability/${stack}/otel-collector/values-${CD_ENV}.generated.yaml"
            fi
            # Velero is a single addon (not stack-split) — render its backup bucket.
            python3 scripts/render_gitops.py --obs-contract "$obs" \
              --velero-out "gitops/infra/velero/values-${CD_ENV}.generated.yaml"
          fi
          # Cluster-identity Helm values — `render` mode only. In `eso` mode the
          # karpenter-contract / keycloak-contract Secrets deliver these at runtime.
          if [ "$MODE" = "render" ]; then
            python3 scripts/render_gitops.py --contract "$contract" \
              --karpenter-out "gitops/infra/karpenter/values-${CD_ENV}.generated.yaml"
            # Keycloak render values exist only for an RDS-direct env in render mode
            # (prod). staging also uses RDS, but via eso (values-staging.eso.yaml);
            # dev runs the in-cluster Postgres, so neither consumes a generated file.
            if [ "$CD_ENV" = "prod" ]; then
              python3 scripts/render_gitops.py --contract "$contract" \
                --keycloak-out "gitops/infra/keycloak/values-prod.generated.yaml"
            fi
          else
            echo "mode is '${MODE}': skipping karpenter/keycloak render (delivered via External Secrets)."
          fi

      - name: Commit rendered manifests
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name "gitops-renderer[bot]"
          git config user.email "gitops-renderer@users.noreply.github.com"
          git add "contracts/gitops-contract.${CD_ENV}.json" \
            "infra/overlays/${CD_ENV}/crossplane/provider-sql.yaml" \
            "platform/functions/functions.yaml"
          # cilium/otel/velero generated values are rendered in both modes (above),
          # so commit whichever were produced for this env, regardless of MODE.
          for f in \
            "gitops/infra/cilium/values-${CD_ENV}.generated.yaml" \
            "gitops/infra/velero/values-${CD_ENV}.generated.yaml" \
            gitops/observability/*/otel-collector/values-${CD_ENV}.generated.yaml ; do
            [ -f "$f" ] && git add "$f"
          done
          if [ "$MODE" = "render" ]; then
            git add "gitops/infra/karpenter/values-${CD_ENV}.generated.yaml"
            [ "$CD_ENV" = "prod" ] && git add "gitops/infra/keycloak/values-prod.generated.yaml" || true
          fi
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "render gitops manifests for ${CD_ENV} (${MODE} mode)"
            git push
          fi
