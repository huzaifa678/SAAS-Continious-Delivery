---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: appdatabase.postgres.platform.saas.example
  labels:
    provider: postgresql
    type: appdatabase
spec:
  compositeTypeRef:
    apiVersion: platform.saas.example/v1alpha1
    kind: XAppDatabase
  # The connection secret published back to the claim namespace contains
  # everything an app needs to connect — host, port, db, user, password, dsn.
  writeConnectionSecretsToNamespace: crossplane-system
  resources:
    # ─── 1. The owning role (Postgres user) ──────────────────────────────────
    - name: role
      base:
        apiVersion: postgresql.sql.crossplane.io/v1alpha1
        kind: Role
        spec:
          forProvider:
            privileges:
              login: true
              createDb: false
              createRole: false
          writeConnectionSecretToRef:
            namespace: crossplane-system
            name: ""  # patched below
      patches:
        - fromFieldPath: spec.parameters.owner
          toFieldPath: metadata.name
        - fromFieldPath: spec.parameters.instance
          toFieldPath: spec.providerConfigRef.name
          transforms:
            - type: string
              string:
                fmt: "rds-%s"
        - fromFieldPath: metadata.uid
          toFieldPath: spec.writeConnectionSecretToRef.name
          transforms:
            - type: string
              string:
                fmt: "%s-role"
      connectionDetails:
        - fromConnectionSecretKey: username
        - fromConnectionSecretKey: password
        - fromConnectionSecretKey: endpoint
          name: host

    # ─── 2. The database, owned by the role ──────────────────────────────────
    - name: database
      base:
        apiVersion: postgresql.sql.crossplane.io/v1alpha1
        kind: Database
        spec:
          forProvider: {}
      patches:
        - fromFieldPath: spec.parameters.databaseName
          toFieldPath: metadata.name
        - fromFieldPath: spec.parameters.owner
          toFieldPath: spec.forProvider.owner
        - fromFieldPath: spec.parameters.instance
          toFieldPath: spec.providerConfigRef.name
          transforms:
            - type: string
              string:
                fmt: "rds-%s"

    # ─── 3. Grant ALL privileges on the database to the role ─────────────────
    - name: grant
      base:
        apiVersion: postgresql.sql.crossplane.io/v1alpha1
        kind: Grant
        spec:
          forProvider:
            privileges:
              - ALL
      patches:
        - fromFieldPath: spec.parameters.databaseName
          toFieldPath: metadata.name
          transforms:
            - type: string
              string:
                fmt: "%s-owner-grant"
        - fromFieldPath: spec.parameters.owner
          toFieldPath: spec.forProvider.role
        - fromFieldPath: spec.parameters.databaseName
          toFieldPath: spec.forProvider.database
        - fromFieldPath: spec.parameters.instance
          toFieldPath: spec.providerConfigRef.name
          transforms:
            - type: string
              string:
                fmt: "rds-%s"
